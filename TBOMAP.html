<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Race Navigator v0.1</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,sans-serif;
    background:#000;
}

#map{
    width:100%;
    height:100%;
}

#info{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:rgba(0,0,0,0.7);
    color:#fff;
    padding:10px;
    border-radius:10px;
}

#buttons{
    position:absolute;
    right:10px;
    bottom:20px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:8px;
}

button{
    width:70px;
    height:45px;
    border:none;
    border-radius:8px;
    background:#333;
    color:#fff;
    font-size:20px;
}

button.active{
    background:#008800;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="info">
<div id="targetName">MARK①</div>
<div id="gps">GPS: ---</div>
</div>

<div id="buttons">
    <button class="active" onclick="selectMark(0)">①</button>
    <button onclick="selectMark(1)">②</button>
    <button onclick="selectMark(2)">③</button>
</div>

<script>

const marks=[
{
    name:"MARK①",
    lat:35.484333,
    lng:139.915833
},
{
    name:"MARK②",
    lat:35.483833,
    lng:139.909833
},
{
    name:"MARK③",
    lat:35.483333,
    lng:139.903833
}
];

let selected=0;
let boatMarker;

const map=new maplibregl.Map({
    container:"map",
    style:"https://demotiles.maplibre.org/style.json",
    center:[marks[0].lng,marks[0].lat],
    zoom:15
});

map.addControl(new maplibregl.NavigationControl());

map.on("load",()=>{

    // マーク表示
    marks.forEach((m,i)=>{

        new maplibregl.Marker({
            color:(i===0?"red":"orange")
        })
        .setLngLat([m.lng,m.lat])
        .setPopup(
            new maplibregl.Popup().setText(m.name)
        )
        .addTo(map);

    });

    // ヨット
    const boat=document.createElement("div");
    boat.innerHTML="⛵";
    boat.style.fontSize="28px";

    boatMarker=new maplibregl.Marker({
        element:boat
    })
    .setLngLat([marks[0].lng,marks[0].lat])
    .addTo(map);

    startGPS();

});

function startGPS(){

    if(!navigator.geolocation){

        alert("GPS非対応");

        return;
    }

    navigator.geolocation.watchPosition(

        updatePosition,

        error=>{

            document.getElementById("gps").innerHTML="GPS: ×";

        },

        {
            enableHighAccuracy:true,
            maximumAge:0
        }

    );

}

function updatePosition(pos){

    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;

    boatMarker.setLngLat([lng,lat]);

    map.easeTo({

        center:[lng,lat],
        duration:500

    });

    document.getElementById("gps").innerHTML="GPS: ●";

}

function selectMark(index){

    selected = index;

    document.getElementById("targetName").textContent =
        marks[index].name;

    const buttons =
        document.querySelectorAll("#buttons button");

    buttons.forEach((button, i) => {

        button.classList.toggle("active", i === index);

    });

}

</script>

</body>
</html>
