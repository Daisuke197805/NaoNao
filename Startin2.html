<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レースナビ（距離・速度・方位）</title>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }

  .wrap {
    padding-top: 20px;
  }

  #distance {
    font-size: 70px;
    font-weight: bold;
    margin-top: 10px;
  }

  #speed {
    font-size: 40px;
    color: #00ffcc;
    margin-top: 10px;
  }

  #bearing {
    font-size: 32px;
    color: #ffcc00;
    margin-top: 10px;
  }

  button {
    width: 80%;
    padding: 16px;
    margin: 6px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
  }

  .b1 { background:#333; color:white; }
  .b2 { background:#444; color:white; }
  .b3 { background:#0066ff; color:white; }
  .stop { background:#aa0000; color:white; }
</style>
</head>

<body>

<div class="wrap">

  <div id="distance">---</div>
  <div id="speed">0.0 kt</div>
  <div id="bearing">--- °</div>

  <button class="b1" onclick="setP1()">地点1取得</button>
  <button class="b2" onclick="setP2()">地点2取得</button>
  <button class="b3" onclick="start()">開始</button>
  <button class="stop" onclick="stop()">停止</button>

</div>

<script>

let p1 = null;
let p2 = null;

let timer = null;

// バッファ
let posBuffer = [];
let speedBuffer = [];
let bearingBuffer = [];

// 現在地取得
function getPos() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      p => resolve(p.coords),
      e => reject(e),
      { enableHighAccuracy: true }
    );
  });
}

// 地点取得
async function setP1() {
  p1 = await getPos();
  alert("地点1セット");
}

async function setP2() {
  p2 = await getPos();
  alert("地点2セット");
}

// 距離計算
function dist(a, b) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;

  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);

  const x =
    Math.sin(dLat/2)**2 +
    Math.cos(toRad(a.lat)) *
    Math.cos(toRad(b.lat)) *
    Math.sin(dLon/2)**2;

  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

// 垂線距離
function signedDistance(p, a, b) {

  const ax = a.lon * Math.cos(a.lat * Math.PI/180);
  const ay = a.lat;

  const bx = b.lon * Math.cos(b.lat * Math.PI/180);
  const by = b.lat;

  const px = p.lon * Math.cos(p.lat * Math.PI/180);
  const py = p.lat;

  const ABx = bx - ax;
  const ABy = by - ay;

  const APx = px - ax;
  const APy = py - ay;

  const cross = ABx * APy - ABy * APx;
  const sign = cross >= 0 ? 1 : -1;

  const ABlen2 = ABx*ABx + ABy*ABy;
  const t = (APx*ABx + APy*ABy) / ABlen2;

  const cx = ax + t * ABx;
  const cy = ay + t * ABy;

  return sign * dist(p, {
    lat: cy,
    lon: cx / Math.cos(p.lat * Math.PI/180)
  });
}

// 方位計算
function calcBearing(a, b) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  const lat1 = toRad(a.lat);
  const lat2 = toRad(b.lat);
  const dLon = toRad(b.lon - a.lon);

  const y = Math.sin(dLon) * Math.cos(lat2);
  const x =
    Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);

  let brng = toDeg(Math.atan2(y, x));
  return (brng + 360) % 360;
}

// ノット速度
function calcSpeed(a, b, dt) {
  const d = dist(a, b);
  return (d / dt) * 1.94384;
}

// 角度平均（重要）
function avgBearing(list) {
  let x = 0;
  let y = 0;

  for (let b of list) {
    const r = b * Math.PI / 180;
    x += Math.cos(r);
    y += Math.sin(r);
  }

  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

// 中央値
function median(arr) {
  const s = [...arr].sort((a,b)=>a-b);
  return s[Math.floor(s.length/2)];
}

// 更新
async function update() {

  if (!p1 || !p2) return;

  const pos = await getPos();

  const now = {
    lat: pos.latitude,
    lon: pos.longitude,
    t: Date.now()
  };

  // バッファ
  posBuffer.push(now);
  if (posBuffer.length > 3) posBuffer.shift();

  // 距離
  const d = signedDistance(now, p1, p2);

  const dEl = document.getElementById("distance");
  dEl.textContent = Math.round(d) + " m";
  dEl.style.color = (d < 0) ? "red" : "white";

  // 速度
  let speed = 0;

  if (posBuffer.length === 3) {
    const a = posBuffer[0];
    const b = posBuffer[2];
    const dt = (b.t - a.t) / 1000;

    if (dt > 0) {
      speed = calcSpeed(a, b, dt);
    }
  }

  speedBuffer.push(speed);
  if (speedBuffer.length > 5) speedBuffer.shift();

  const stableSpeed = median(speedBuffer);

  document.getElementById("speed").textContent =
    stableSpeed.toFixed(1) + " kt";

  // 方位
  if (posBuffer.length === 3) {
    const a = posBuffer[0];
    const b = posBuffer[2];

    const brg = calcBearing(a, b);

    bearingBuffer.push(brg);
    if (bearingBuffer.length > 5) bearingBuffer.shift();

    const stableBrg = avgBearing(bearingBuffer);

    document.getElementById("bearing").textContent =
      Math.round(stableBrg) + " °";
  }
}

// 開始
function start() {
  if (timer) clearInterval(timer);
  update();
  timer = setInterval(update, 1000);
}

// 停止
function stop() {
  clearInterval(timer);
  timer = null;
}

</script>

</body>
</html>
