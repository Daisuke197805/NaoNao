<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レース計測アプリ</title>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }

  .wrap {
    padding-top: 20px;
  }

  #distance {
    font-size: 72px;
    font-weight: bold;
    margin-top: 20px;
  }

  #speed {
    font-size: 42px;
    margin-top: 10px;
    color: #00ffcc;
  }

  button {
    width: 80%;
    padding: 16px;
    margin: 6px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
  }

  .b1 { background:#333; color:white; }
  .b2 { background:#444; color:white; }
  .b3 { background:#0066ff; color:white; }
  .stop { background:#aa0000; color:white; }
</style>
</head>

<body>

<div class="wrap">

  <div id="distance">---</div>
  <div id="speed">0.0 kt</div>

  <button class="b1" onclick="setP1()">地点1取得</button>
  <button class="b2" onclick="setP2()">地点2取得</button>
  <button class="b3" onclick="start()">開始</button>
  <button class="stop" onclick="stop()">停止</button>

</div>

<script>

let p1 = null;
let p2 = null;

let timer = null;

// 位置バッファ（3点）
let buffer = [];
let speedBuffer = [];

// 現在地取得
function getPos() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      p => resolve(p.coords),
      e => reject(e),
      { enableHighAccuracy: true }
    );
  });
}

// 地点セット
async function setP1() {
  p1 = await getPos();
  alert("地点1セット");
}

async function setP2() {
  p2 = await getPos();
  alert("地点2セット");
}

// 距離計算（m）
function dist(a, b) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;

  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);

  const x =
    Math.sin(dLat/2)**2 +
    Math.cos(toRad(a.lat)) *
    Math.cos(toRad(b.lat)) *
    Math.sin(dLon/2)**2;

  return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

// 垂線距離（符号付き簡易ベクトル）
function signedDistance(p, a, b) {

  const ax = a.lon * Math.cos(a.lat * Math.PI/180);
  const ay = a.lat;

  const bx = b.lon * Math.cos(b.lat * Math.PI/180);
  const by = b.lat;

  const px = p.lon * Math.cos(p.lat * Math.PI/180);
  const py = p.lat;

  const ABx = bx - ax;
  const ABy = by - ay;

  const APx = px - ax;
  const APy = py - ay;

  const cross = ABx * APy - ABy * APx;

  const sign = cross >= 0 ? 1 : -1;

  const ABlen2 = ABx*ABx + ABy*ABy;
  const t = (APx*ABx + APy*ABy) / ABlen2;

  const cx = ax + t * ABx;
  const cy = ay + t * ABy;

  const d = dist(p, {
    lat: cy,
    lon: cx / Math.cos(p.lat * Math.PI/180)
  });

  return sign * d;
}

// 速度（kt）
function calcSpeed(p1, p2, dt) {
  const d = dist(p1, p2);
  const mps = d / dt;
  return mps * 1.94384;
}

// 中央値で安定化
function median(arr) {
  const s = [...arr].sort((a,b)=>a-b);
  return s[Math.floor(s.length/2)];
}

// 更新処理
async function update() {

  if (!p1 || !p2) return;

  const pos = await getPos();

  const now = {
    lat: pos.latitude,
    lon: pos.longitude,
    t: Date.now()
  };

  // 垂線距離
  const d = signedDistance(now, p1, p2);

  const dEl = document.getElementById("distance");
  dEl.textContent = Math.round(d) + " m";
  dEl.style.color = (d < 0) ? "red" : "white";

  // バッファ管理（3点）
  buffer.push(now);
  if (buffer.length > 3) buffer.shift();

  let speed = 0;

  if (buffer.length === 3) {
    const pA = buffer[0];
    const pB = buffer[2];
    const dt = (pB.t - pA.t) / 1000;

    if (dt > 0) {
      speed = calcSpeed(pA, pB, dt);
    }
  }

  // スピード平滑化（5点）
  speedBuffer.push(speed);
  if (speedBuffer.length > 5) speedBuffer.shift();

  const stableSpeed = median(speedBuffer);

  document.getElementById("speed").textContent =
    stableSpeed.toFixed(1) + " kt";
}

// 開始
function start() {
  if (timer) clearInterval(timer);
  update();
  timer = setInterval(update, 1000);
}

// 停止
function stop() {
  clearInterval(timer);
  timer = null;
}

</script>

</body>
</html>
