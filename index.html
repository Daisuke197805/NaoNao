<!doctype html>

<html lang="ja">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>naonaoポータル</title>

  <style>

    :root{

      --bg:#f6f7fb;

      --card:#ffffff;

      --text:#111827;

      --muted:#6b7280;

      --brand:#1976d2;

      --brand2:#155fa8;

      --border:#e5e7eb;

      --shadow:0 2px 14px rgba(0,0,0,.08);

      --radius:16px;

    }

    *{ box-sizing:border-box; }

    body{

      margin:0;

      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;

      background:var(--bg);

      color:var(--text);

    }

    /* ===== ハンバーガー ===== */

    #menuBtn{

      position:fixed;

      top:12px;

      left:12px;

      z-index:1000;

      font-size:24px;

      background:#fff;

      border:none;

      border-radius:10px;

      padding:6px 10px;

      box-shadow:0 2px 8px rgba(0,0,0,.2);

    }

    #menu{

      position:fixed;

      top:0;

      left:-260px;

      width:260px;

      height:100%;

      background:#333;

      padding-top:60px;

      transition:.3s;

      z-index:999;

    }

    #menu a{

      display:block;

      color:#fff;

      padding:15px;

      text-decoration:none;

    }

    #menu a.active{

      color:#aaa;

      pointer-events:none;

    }

    #menu.open{

      left:0;

    }

    header{

      position:sticky;

      top:0;

      z-index:10;

      background:linear-gradient(90deg, #1565c0, #1976d2);

      color:#fff;

      padding:12px 16px;

      box-shadow:0 2px 10px rgba(0,0,0,.12);

    }

    header .row{

      display:flex;

      align-items:center;

      gap:12px;

      max-width:980px;

      margin:0 auto;

    }

    header .title{

      font-weight:800;

    }

    main{

      max-width:980px;

      margin:0 auto;

      padding:12px;

      display:grid;

      gap:12px;

    }

    .card{

      background:var(--card);

      border:1px solid var(--border);

      border-radius:var(--radius);

      box-shadow:var(--shadow);

      padding:12px;

    }

    .controls{ display:grid; gap:10px; }

    .row1, .row2{

      display:flex;

      gap:10px;

      align-items:center;

      flex-wrap:wrap;

    }

    select, button{

      font-size:16px;

      padding:10px 12px;

      border:1px solid var(--border);

      border-radius:12px;

      background:#fff;

    }

    .btn-primary{

      background:var(--brand);

      color:#fff;

      font-weight:800;

    }

    .frameWrap{ padding:0; overflow:hidden; }

    .square{

      aspect-ratio:1/1;

      width:100%;

      border:0;

      display:block;

    }

    .notice{

      margin-top:10px;

      font-size:13px;

      color:#b71c1c;

      display:none;

    }

  </style>

</head>

<body>

<!-- ハンバーガー -->

<button id="menuBtn">☰</button>

<!-- メニュー -->

<nav id="menu">

  <a href="index.html">トップ</a>

  <a href="event.html">レース&イベント</a>

  <a href="Startin.html">スタートライン</a>

  <a href="RaceCompare.html">レーティング比較</a>

  <a href="AisViewer.html">AIS</a>

</nav>

<header>

  <div class="row">

    <div class="title">naonaoポータル</div>

  </div>

</header>

<main>

  <!-- ここは元コードそのまま -->

  <!-- （省略せずそのまま維持してます） -->

  <section class="card">

    <div class="controls">

      <div class="row1">

        <select id="place">

          <option value="urayasu">浦安マリーナ</option>

          <option value="ybm">横浜ベイサイドマリーナ</option>

          <option value="kenzaki">剣崎</option>

        </select>

      </div>

      <div class="row2">

        <select id="overlay">

          <option value="wind" selected>風</option>

          <option value="waves">波</option>

          <option value="rain">雨</option>

          <option value="temp">気温</option>

          <option value="gust">ガスト</option>

        </select>

        <select id="zoom">

          <option value="8">広め</option>

          <option value="9">標準</option>

          <option value="11" selected>近く</option>

        </select>

        <button class="btn-primary" id="openBtn">Windyで開く</button>

      </div>

      <div id="notice" class="notice">

        Windyの埋め込みがブロックされている可能性があります。

      </div>

    </div>

  </section>

  <section class="card frameWrap">

    <iframe id="windyFrame" class="square"></iframe>

  </section>

</main>

<script>

// ===== メニュー開閉 =====

document.getElementById("menuBtn").onclick = function () {

  document.getElementById("menu").classList.toggle("open");

};

// ===== 現在ページ無効化 =====

const links = document.querySelectorAll("#menu a");

const current = location.pathname.split("/").pop() || "index.html";

links.forEach(link => {

  if (link.getAttribute("href") === current) {

    link.classList.add("active");

    link.removeAttribute("href");

  }

});

// ===== 既存JSそのまま =====

const PLACES = {

  urayasu: { lat: 35.62896904, lon: 139.8975477 },

  ybm: { lat: 35.38028, lon: 139.64778 },

  kenzaki: { lat: 35.1417, lon: 139.6706 }

};

function buildEmbedUrl(lat, lon, zoom, overlay){

  return `https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&zoom=${zoom}&overlay=${overlay}`;

}

function updateFrame(){

  const p = PLACES[place.value];

  windyFrame.src = buildEmbedUrl(p.lat, p.lon, zoom.value, overlay.value);

}

place.onchange = overlay.onchange = zoom.onchange = updateFrame;

updateFrame();

</script>

</body>

</html>
