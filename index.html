<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8" />

<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>naonaoポータル</title>

<style>

:root{

  --bg:#f6f7fb;

  --card:#ffffff;

  --text:#111827;

  --brand:#1976d2;

  --border:#e5e7eb;

}

*{ box-sizing:border-box; }

body{

  margin:0;

  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;

  background:var(--bg);

  color:var(--text);

}

/* ===== ハンバーガー（右上） ===== */

#menuBtn{

  position:fixed;

  top:12px;

  right:12px;

  z-index:1001;

  font-size:24px;

  background:#fff;

  border:none;

  border-radius:10px;

  padding:6px 10px;

  box-shadow:0 2px 8px rgba(0,0,0,.2);

}

/* ===== メニュー（右から出る） ===== */

#menu{

  position:fixed;

  top:0;

  right:-260px;

  width:260px;

  height:100%;

  background:#333;

  padding-top:60px;

  transition:.3s;

  z-index:1000;

}

#menu.open{

  right:0;

}

#menu a{

  display:block;

  color:#fff;

  padding:15px;

  text-decoration:none;

}

#menu a.active{

  color:#aaa;

  pointer-events:none;

}

/* ===== 半透明背景 ===== */

#overlay{

  position:fixed;

  top:0;

  left:0;

  width:100%;

  height:100%;

  background:rgba(0,0,0,0.4);

  opacity:0;

  visibility:hidden;

  transition:.3s;

  z-index:999;

}

#overlay.show{

  opacity:1;

  visibility:visible;

}

/* ===== ヘッダー ===== */

header{

  position:sticky;

  top:0;

  background:linear-gradient(90deg,#1565c0,#1976d2);

  color:#fff;

  padding:12px 16px;

}

.title{

  font-weight:800;

}

/* ===== コンテンツ ===== */

main{

  max-width:980px;

  margin:0 auto;

  padding:12px;

}

.card{

  background:#fff;

  border:1px solid var(--border);

  border-radius:12px;

  padding:12px;

}

select, button{

  padding:10px;

  margin:5px 0;

  width:100%;

}

iframe{

  width:100%;

  aspect-ratio:1/1;

  border:0;

}

</style>

</head>

<body>

<!-- ボタン -->

<button id="menuBtn">☰</button>

<!-- オーバーレイ -->

<div id="overlay"></div>

<!-- メニュー -->

<nav id="menu">

  <a href="index.html">トップ</a>

  <a href="event.html">レース&イベント</a>

  <a href="Startin.html">スタートライン</a>

  <a href="RaceCompare.html">レーティング比較</a>

  <a href="AisViewer.html">AIS</a>

</nav>

<header>

  <div class="title">naonaoポータル</div>

</header>

<main>

  <div class="card">

    <select id="place">

      <option value="urayasu">浦安</option>

      <option value="ybm">横浜</option>

    </select>

    <select id="overlaySelect">

      <option value="wind">風</option>

      <option value="rain">雨</option>

    </select>

    <button id="openBtn">Windyで開く</button>

  </div>

  <div class="card">

    <iframe id="windyFrame"></iframe>

  </div>

</main>

<script>

// ===== メニュー開閉 =====

const btn = document.getElementById("menuBtn");

const menu = document.getElementById("menu");

const overlay = document.getElementById("overlay");

btn.onclick = () => {

  menu.classList.toggle("open");

  overlay.classList.toggle("show");

};

// 外側クリックで閉じる

overlay.onclick = () => {

  menu.classList.remove("open");

  overlay.classList.remove("show");

};

// ===== 現在ページ無効化 =====

const links = document.querySelectorAll("#menu a");

const current = location.pathname.split("/").pop() || "index.html";

links.forEach(link => {

  if (link.getAttribute("href") === current) {

    link.classList.add("active");

    link.removeAttribute("href");

  }

});

// ===== Windy =====

const PLACES = {

  urayasu:{lat:35.62,lon:139.89},

  ybm:{lat:35.38,lon:139.64}

};

function update(){

  const p = PLACES[place.value];

  windyFrame.src = `https://embed.windy.com/embed2.html?lat=${p.lat}&lon=${p.lon}&zoom=10&overlay=${overlaySelect.value}`;

}

place.onchange = overlaySelect.onchange = update;

update();

// 外部開く

openBtn.onclick = () => {

  const p = PLACES[place.value];

  location.href = `https://www.windy.com/?lat=${p.lat}&lon=${p.lon}`;

};

</script>

</body>

</html>
