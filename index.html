<!doctype html>

<html lang="ja">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>naonaoポータル</title>

  <style>

    :root{

      --bg:#f6f7fb;

      --card:#ffffff;

      --text:#111827;

      --muted:#6b7280;

      --brand:#1976d2;

      --brand2:#155fa8;

      --border:#e5e7eb;

      --shadow:0 2px 14px rgba(0,0,0,.08);

      --radius:16px;

    }

    *{ box-sizing:border-box; }

    body{

      margin:0;

      font-family: system-ui, -apple-system, Segoe UI, Roboto;

      background:var(--bg);

      color:var(--text);

    }

    /* ===== ハンバーガー ===== */

    #menuBtn{

      position:fixed;

      top:max(12px, env(safe-area-inset-top));

      right:12px;

      z-index:2000;

      font-size:22px;

      background:#fff;

      border:none;

      border-radius:10px;

      padding:6px 10px;

      box-shadow:0 2px 8px rgba(0,0,0,.2);

    }

    /* ===== メニュー ===== */

    #menu{

      position:fixed;

      top:0;

      right:-260px;

      width:260px;

      height:100%;

      background:#333;

      padding-top:60px;

      transition:.3s;

      z-index:1500;

    }

    #menu.open{ right:0; }

    #menu a{

      display:block;

      color:#fff;

      padding:15px;

      text-decoration:none;

    }

    #menu a.active{

      color:#aaa;

      pointer-events:none;

    }

    /* ===== オーバーレイ ===== */

    #overlay{

      position:fixed;

      inset:0;

      background:rgba(0,0,0,.4);

      opacity:0;

      visibility:hidden;

      transition:.3s;

      z-index:1400;

    }

    #overlay.show{

      opacity:1;

      visibility:visible;

    }

    /* ===== ヘッダー ===== */

    header{

      position:sticky;

      top:0;

      z-index:10;

      background:linear-gradient(90deg, #1565c0, #1976d2);

      color:#fff;

      padding:12px 16px;

      box-shadow:0 2px 10px rgba(0,0,0,.12);

    }

    header .row{

      display:flex;

      align-items:center;

      max-width:980px;

      margin:0 auto;

    }

    header .title{

      font-weight:800;

    }

    main{

      max-width:980px;

      margin:0 auto;

      padding:12px;

      display:grid;

      gap:12px;

    }

    .card{

      background:var(--card);

      border:1px solid var(--border);

      border-radius:var(--radius);

      box-shadow:var(--shadow);

      padding:12px;

    }

    select, button{

      font-size:16px;

      padding:10px;

      border:1px solid var(--border);

      border-radius:12px;

      background:#fff;

    }

    .btn-primary{

      background:var(--brand);

      color:#fff;

      font-weight:800;

    }

    iframe{

      width:100%;

      aspect-ratio:1/1;

      border:0;

    }

  </style>

</head>

<body>

<!-- ハンバーガー -->

<button id="menuBtn">☰</button>

<!-- 背景 -->

<div id="overlay"></div>

<!-- メニュー -->

<nav id="menu">

  <a href="index.html">トップ</a>

  <a href="event.html">レース&イベント</a>

  <a href="Startin.html">スタートライン</a>

  <a href="RaceCompare.html">レーティング比較</a>

  <a href="AisViewer.html">AIS</a>

</nav>

<header>

  <div class="row">

    <div class="title">naonaoポータル</div>

  </div>

</header>

<main>

  <section class="card">

    <select id="place">

      <option value="urayasu">浦安マリーナ</option>

      <option value="ybm">横浜ベイサイドマリーナ</option>

      <option value="kenzaki">剣崎</option>

    </select>

    <select id="overlaySelect">

      <option value="wind">風</option>

      <option value="waves">波</option>

    </select>

    <button class="btn-primary" id="openBtn">Windyで開く</button>

  </section>

  <section class="card">

    <iframe id="windyFrame"></iframe>

  </section>

</main>

<script>

// ===== メニュー制御 =====

const menuBtn = document.getElementById("menuBtn");

const menu = document.getElementById("menu");

const overlay = document.getElementById("overlay");

menuBtn.onclick = () => {

  menu.classList.toggle("open");

  overlay.classList.toggle("show");

};

overlay.onclick = () => {

  menu.classList.remove("open");

  overlay.classList.remove("show");

};

// ===== 現在ページ無効化 =====

const links = document.querySelectorAll("#menu a");

const current = location.pathname.split("/").pop() || "index.html";

links.forEach(link => {

  if (link.getAttribute("href") === current) {

    link.classList.add("active");

    link.removeAttribute("href");

  }

});

// ===== 既存JSそのまま =====

const PLACES = {

  urayasu:{lat:35.62,lon:139.89},

  ybm:{lat:35.38,lon:139.64},

  kenzaki:{lat:35.14,lon:139.67}

};

function update(){

  const p = PLACES[place.value];

  windyFrame.src = `https://embed.windy.com/embed2.html?lat=${p.lat}&lon=${p.lon}&overlay=${overlaySelect.value}`;

}

place.onchange = overlaySelect.onchange = update;

update();

openBtn.onclick = () => {

  const p = PLACES[place.value];

  location.href = `https://www.windy.com/?lat=${p.lat}&lon=${p.lon}`;

};

</script>

</body>

</html>
