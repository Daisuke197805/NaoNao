<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Navigation & Timer</title>

<style>
  body{
    margin:0;
    background:black;
    color:white;
    font-family:sans-serif;
    text-align:center;
    overflow:hidden;
  }

  #distance{
    font-size:70px;
    font-weight:bold;
    margin-top:10px;
  }

  #speed{
    font-size:40px;
    color:#00ffcc;
  }

  #bearing{
    font-size:28px;
    color:#ffcc00;
  }

  /* ★ タイマー背景を制御する */
  #timer{
    font-size:100px;
    font-weight:bold;
    margin-top:10px;
    color:lime;
    background:black;
    display:inline-block;
    padding:10px 30px;
    border-radius:12px;
  }

  .panel{
    position:fixed;
    bottom:10px;
    width:48%;
    padding:10px;
    box-sizing:border-box;

    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:space-between;
  }

  .nav{
    left:10px;
    background:rgba(0,255,0,0.12);
    border-radius:12px;
  }

  .timer{
    right:10px;
    background:rgba(255,150,150,0.15);
    border-radius:12px;
  }

  button{
    flex:0 0 48%;
    padding:12px;
    font-size:14px;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
  }

  .big{
    flex:0 0 100%;
    font-size:16px;
    font-weight:bold;
  }

  .b1,.b2{background:#333;color:white;}
  .startNav{background:#0066ff;color:white;}
  .resetNav{background:#444;color:white;}

  .tStart{background:limegreen;color:black;font-weight:bold;}
  .tPlus,.tMinus{background:yellow;color:black;}
  .tStop{background:red;color:white;}
  .tReset{background:#555;color:white;}
</style>
</head>

<body>

<div id="distance">---</div>
<div id="speed">0.0 kt</div>
<div id="bearing">--- °</div>

<div id="timer">5:00</div>

<!-- ナビ -->
<div class="panel nav">
  <button class="b2" onclick="setP2()">②</button>
  <button class="b1" onclick="setP1()">①</button>

  <button class="big startNav" onclick="startNav()">開始</button>
  <button class="big resetNav" onclick="resetNav()">リセット</button>
</div>

<!-- タイマー -->
<div class="panel timer">
  <button class="big tStart" onclick="startTimer()">5分開始</button>

  <button class="tMinus" onclick="adjustTimer(-1)">-1</button>
  <button class="tPlus" onclick="adjustTimer(1)">+1</button>

  <button class="tStop" onclick="stopTimer()">STOP</button>
  <button class="tReset" onclick="resetTimer()">RESET</button>
</div>

<script>

//////////////////////////
// 音声
//////////////////////////

let audioUnlocked = false;

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "ja-JP";
  speechSynthesis.cancel();
  speechSynthesis.speak(msg);
}

function unlockAudio(){
  if(audioUnlocked) return;
  const msg = new SpeechSynthesisUtterance("");
  msg.lang = "ja-JP";
  speechSynthesis.speak(msg);
  audioUnlocked = true;
}

function formatTime(sec){
  let m = Math.floor(sec/60);
  let s = sec%60;

  if(m>0 && s>0) return m+"分"+s+"秒";
  if(m>0) return m+"分";
  return s+"秒";
}

//////////////////////////
// ナビ（そのまま）
//////////////////////////

let p1=null,p2=null;
let navTimer=null;

let buf=[];
let speedBuf=[];
let bearingBuf=[];

function getPos(){
  return new Promise((res,rej)=>{
    navigator.geolocation.getCurrentPosition(
      p=>res(p.coords),
      e=>rej(e),
      {enableHighAccuracy:true}
    );
  });
}

async function setP1(){ p1=await getPos(); alert("①セット"); }
async function setP2(){ p2=await getPos(); alert("②セット"); }

/* calcBearing未定義はそのまま（既存前提） */

//////////////////////////
// タイマー
//////////////////////////

let t=300;
let timer=null;

function updateTimer(){
  let m=Math.floor(t/60);
  let s=t%60;

  document.getElementById("timer").textContent=
    m+":"+String(s).padStart(2,"0");

  // ★ 背景色ルール（ここが今回の本題）
  const el = document.getElementById("timer");

  if(t === 0){
    el.style.background = "blue";
  }else if(t <= 10){
    el.style.background = "red";
  }else if(t <= 60){
    el.style.background = "yellow";
  }else{
    el.style.background = "black";
  }
}

function startTimer(){

  unlockAudio();

  t=300;
  updateTimer();

  if(timer)return;

  timer=setInterval(()=>{

    if(t>0)t--;
    updateTimer();

    if(t===0){
      speak("スタート");
      clearInterval(timer);
    }

  },1000);
}

function stopTimer(){
  clearInterval(timer);
  timer=null;
}

function resetTimer(){
  t=300;
  updateTimer();
}

function adjustTimer(v){
  t+=v;
  if(t<0)t=0;
  updateTimer();
}

updateTimer();

</script>

</body>
</html>
