<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Navigation & Timer</title>

<style>
  body{
    margin:0;
    background:black;
    color:white;
    font-family:sans-serif;
    text-align:center;
    overflow:hidden;
  }

  #distance{
    font-size:70px;
    font-weight:bold;
    margin-top:10px;
  }

  #speed{
    font-size:40px;
    color:#00ffcc;
  }

  #bearing{
    font-size:28px;
    color:#ffcc00;
  }

  #timer{
    font-size:100px;
    font-weight:bold;
    margin-top:10px;
    background:black;
    color:lime;
    display:inline-block;
    padding:10px 30px;
    border-radius:12px;
  }

  #lockIcon{
    position:fixed;
    top:10px;
    right:15px;
    font-size:28px;
    cursor:pointer;
    z-index:10001;
  }

  #lockOverlay{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:180px;
    background:rgba(0,0,0,0.55);
    display:none;
    z-index:10000;
  }

  .panel{
    position:fixed;
    bottom:10px;
    width:48%;
    padding:10px;
    box-sizing:border-box;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:space-between;
  }

  .nav{
    left:10px;
    background:rgba(0,255,0,0.12);
    border-radius:12px;
  }

  .timerPanel{
    right:10px;
    background:rgba(255,150,150,0.15);
    border-radius:12px;
  }

  button{
    flex:0 0 48%;
    padding:12px;
    font-size:14px;
    border:none;
    border-radius:10px;
  }

  .big{
    flex:0 0 100%;
    font-size:16px;
    font-weight:bold;
  }

  .b1,.b2{background:#333;color:white;}
  .startNav{background:#0066ff;color:white;}
  .resetNav{background:#444;color:white;}
</style>
</head>

<body>

<div id="lockIcon" onclick="toggleLock()">🔓</div>
<div id="lockOverlay"></div>

<div id="distance">---</div>
<div id="speed">0.0 kt</div>
<div id="bearing">--- °</div>

<div id="timer">5:00</div>

<!-- ナビ -->
<div class="panel nav">
  <button onclick="setP2()">②</button>
  <button onclick="setP1()">①</button>
  <button class="big" onclick="startNav()">開始</button>
  <button class="big" onclick="resetNav()">リセット</button>
</div>

<!-- タイマー -->
<div class="panel timerPanel">
  <button class="big" onclick="startTimer()">5分開始</button>
  <button onclick="adjustTimer(-1)">-1</button>
  <button onclick="adjustTimer(1)">+1</button>
  <button onclick="stopTimer()">STOP</button>
  <button onclick="resetTimer()">RESET</button>
</div>

<script>

//////////////////////////////
// ロック
//////////////////////////////

let isLocked=false;

function toggleLock(){
  isLocked=!isLocked;
  document.getElementById("lockIcon").textContent=isLocked?"🔒":"🔓";
  document.getElementById("lockOverlay").style.display=isLocked?"block":"none";
}

//////////////////////////////
// GPS
//////////////////////////////

let p1=null,p2=null;
let navTimer=null;
let buf=[];

function getPos(){
  return new Promise((res,rej)=>{
    navigator.geolocation.getCurrentPosition(
      p=>res({
        lat:p.coords.latitude,
        lon:p.coords.longitude,
        t:Date.now()
      }),
      e=>rej(e),
      {enableHighAccuracy:true}
    );
  });
}

async function setP1(){
  p1=await getPos();
  alert("①セット");
}

async function setP2(){
  p2=await getPos();
  alert("②セット");
}

//////////////////////////////
// クロストラック距離（核心）
//////////////////////////////

function crossTrackDistance(p,a,b){

  const ax=a.lon*Math.cos(a.lat*Math.PI/180);
  const ay=a.lat;

  const bx=b.lon*Math.cos(b.lat*Math.PI/180);
  const by=b.lat;

  const px=p.lon*Math.cos(p.lat*Math.PI/180);
  const py=p.lat;

  const ABx=bx-ax;
  const ABy=by-ay;

  const APx=px-ax;
  const APy=py-ay;

  const abLen=Math.sqrt(ABx*ABx + ABy*ABy);

  if(abLen===0) return 0;

  const cross=ABx*APy - ABy*APx;

  return cross / abLen; // +右 / -左
}

//////////////////////////////
// 速度・方位
//////////////////////////////

function dist(a,b){
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat);
  const dLon=toRad(b.lon-a.lon);

  const x=
    Math.sin(dLat/2)**2+
    Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*
    Math.sin(dLon/2)**2;

  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function speed(a,b){
  const dt=(b.t-a.t)/1000;
  if(dt<=0) return 0;
  return (dist(a,b)/dt)*1.94384;
}

function bearing(a,b){
  const toRad=d=>d*Math.PI/180;
  const y=Math.sin(toRad(b.lon-a.lon))*Math.cos(toRad(b.lat));
  const x=
    Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-
    Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lon-a.lon));

  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

//////////////////////////////
// 更新
//////////////////////////////

async function updateNav(){

  if(!p1||!p2) return;

  const pos=await getPos();

  buf.push(pos);
  if(buf.length>3) buf.shift();

  // ★ クロストラック距離
  const ctd = crossTrackDistance(pos,p1,p2);
  document.getElementById("distance").textContent =
    ctd.toFixed(1)+" m";

  // ★ 速度
  let sp=0;
  if(buf.length>=2){
    sp=speed(buf[buf.length-2],buf[buf.length-1]);
  }
  document.getElementById("speed").textContent =
    sp.toFixed(1)+" kt";

  // ★ 方位
  if(buf.length>=2){
    const brg=bearing(buf[buf.length-2],buf[buf.length-1]);
    document.getElementById("bearing").textContent =
      Math.round(brg)+" °";
  }
}

function startNav(){
  if(navTimer) clearInterval(navTimer);
  updateNav();
  navTimer=setInterval(updateNav,1000);
}

function resetNav(){
  p1=p2=null;
  buf=[];
  document.getElementById("distance").textContent="---";
  document.getElementById("speed").textContent="0.0 kt";
  document.getElementById("bearing").textContent="--- °";
}

//////////////////////////////
// タイマー
//////////////////////////////

let t=300;
let timer=null;

function updateTimer(){
  let m=Math.floor(t/60);
  let s=t%60;
  document.getElementById("timer").textContent=
    m+":"+String(s).padStart(2,"0");
}

function startTimer(){
  t=300;
  updateTimer();
  if(timer) return;

  timer=setInterval(()=>{
    if(t>0)t--;
    updateTimer();
  },1000);
}

function stopTimer(){ clearInterval(timer); timer=null; }

function resetTimer(){ t=300; updateTimer(); }

function adjustTimer(v){ t+=v; if(t<0)t=0; updateTimer(); }

updateTimer();

</script>

</body>
</html>
