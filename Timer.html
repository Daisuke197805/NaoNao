<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Navigation & Timer</title>

<style>
  body{
    margin:0;
    background:black;
    color:white;
    font-family:sans-serif;
    text-align:center;
    overflow:hidden;
  }

  #distance{
    font-size:70px;
    font-weight:bold;
    margin-top:10px;
  }

  #speed{
    font-size:40px;
    color:#00ffcc;
  }

  #bearing{
    font-size:28px;
    color:#ffcc00;
  }

  #timer{
    font-size:100px;
    font-weight:bold;
    margin-top:10px;
    background:black;
    color:lime;
    display:inline-block;
    padding:10px 30px;
    border-radius:12px;
  }

  #lockIcon{
    position:fixed;
    top:10px;
    right:15px;
    font-size:28px;
    cursor:pointer;
    z-index:10001;
  }

  #lockOverlay{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:180px;
    background:rgba(0,0,0,0.55);
    display:none;
    z-index:10000;
  }

  .panel{
    position:fixed;
    bottom:10px;
    width:48%;
    padding:10px;
    box-sizing:border-box;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:space-between;
  }

  .nav{
    left:10px;
    background:rgba(0,255,0,0.12);
    border-radius:12px;
  }

  .timerPanel{
    right:10px;
    background:rgba(255,150,150,0.15);
    border-radius:12px;
  }

  button{
    flex:0 0 48%;
    padding:12px;
    font-size:14px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
  }

  .big{
    flex:0 0 100%;
    font-size:16px;
    font-weight:bold;
  }

  /* ★ 選択状態（薄ピンク） */
  .selected{
    background:#ffb6c1 !important;
    color:black !important;
  }
</style>
</head>

<body>

<div id="lockIcon" onclick="toggleLock()">🔓</div>
<div id="lockOverlay"></div>

<div id="distance">---</div>
<div id="speed">0.0 kt</div>
<div id="bearing">--- °</div>

<div id="timer">5:00</div>

<!-- ナビ -->
<div class="panel nav">
  <button id="btnP2" onclick="setP2()">②</button>
  <button id="btnP1" onclick="setP1()">①</button>
  <button class="big" onclick="startNav()">開始</button>
  <button class="big" onclick="resetNav()">リセット</button>
</div>

<!-- タイマー -->
<div class="panel timerPanel">
  <button class="big" onclick="startTimer()">5分開始</button>
  <button onclick="adjustTimer(-1)">-1</button>
  <button onclick="adjustTimer(1)">+1</button>
  <button onclick="stopTimer()">STOP</button>
  <button onclick="resetTimer()">RESET</button>
</div>

<script>

//////////////////////////////
// 状態
//////////////////////////////

let p1=null,p2=null;

//////////////////////////////
// ボタン状態管理
//////////////////////////////

function setP1(){
  getPos().then(pos=>{
    p1=pos;
    document.getElementById("btnP1").classList.add("selected");
  });
}

function setP2(){
  getPos().then(pos=>{
    p2=pos;
    document.getElementById("btnP2").classList.add("selected");
  });
}

function getPos(){
  return new Promise((res,rej)=>{
    navigator.geolocation.getCurrentPosition(
      p=>res({
        lat:p.coords.latitude,
        lon:p.coords.longitude,
        t:Date.now()
      }),
      e=>rej(e),
      {enableHighAccuracy:true}
    );
  });
}

//////////////////////////////
// クロストラック距離
//////////////////////////////

function toXY(p){
  const latScale = 111320;
  const lonScale = 111320 * Math.cos(p.lat * Math.PI/180);

  return {
    x: p.lon * lonScale,
    y: p.lat * latScale
  };
}

function crossTrackDistance(p,a,b){

  const P=toXY(p);
  const A=toXY(a);
  const B=toXY(b);

  const ABx=B.x-A.x;
  const ABy=B.y-A.y;

  const APx=P.x-A.x;
  const APy=P.y-A.y;

  const abLen=Math.sqrt(ABx*ABx+ABy*ABy);
  if(abLen===0) return 0;

  const cross=ABx*APy-ABy*APx;

  return cross/abLen;
}

//////////////////////////////
// ナビ
//////////////////////////////

let navTimer=null;

async function updateNav(){

  if(!p1||!p2) return;

  const pos=await getPos();

  let ctd=crossTrackDistance(pos,p1,p2);

  if(Math.abs(ctd)<0.5) ctd=0;

  document.getElementById("distance").textContent=
    ctd.toFixed(1)+" m";
}

function startNav(){
  if(navTimer) clearInterval(navTimer);
  updateNav();
  navTimer=setInterval(updateNav,1000);
}

function resetNav(){
  p1=null;p2=null;

  document.getElementById("btnP1").classList.remove("selected");
  document.getElementById("btnP2").classList.remove("selected");

  document.getElementById("distance").textContent="---";
}

//////////////////////////////
// タイマー（そのまま）
//////////////////////////////

let t=300;
let timer=null;

function startTimer(){
  t=300;
  updateTimer();
  if(timer) return;

  timer=setInterval(()=>{
    if(t>0)t--;
    updateTimer();
  },1000);
}

function updateTimer(){
  let m=Math.floor(t/60);
  let s=t%60;
  document.getElementById("timer").textContent=
    m+":"+String(s).padStart(2,"0");
}

function stopTimer(){ clearInterval(timer); timer=null; }

function resetTimer(){ t=300; updateTimer(); }

function adjustTimer(v){ t+=v;if(t<0)t=0;updateTimer(); }

updateTimer();

</script>

</body>
</html>
