<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Watch Start Timer</title>

<style>

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:#fff;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* 上部20%空白 */
#app{
  width:100%;
  height:100%;
  box-sizing:border-box;

  padding-top:20vh;

  display:flex;
  flex-direction:column;
  align-items:center;
}

/* 時間表示 */
#timer{

  width:100%;

  text-align:center;

  font-size:92px;
  font-weight:700;
  letter-spacing:2px;

  line-height:1;

  user-select:none;
  -webkit-user-select:none;

  touch-action:manipulation;

  margin-bottom:28px;
}

/* リセットボタン */
#resetBtn{

  width:78%;
  height:54px;

  border:none;
  border-radius:18px;

  font-size:22px;
  font-weight:700;

  background:#7a1f1f;
  color:#fff;

  -webkit-tap-highlight-color:transparent;
}

#resetBtn:active{
  transform:scale(0.98);
}

</style>
</head>

<body>

<div id="app">

  <div id="timer">05:00</div>

  <button id="resetBtn">RESET</button>

</div>

<script>

const timerEl   = document.getElementById("timer");
const resetBtn  = document.getElementById("resetBtn");

let totalSeconds = 300;
let interval = null;

/* 表示更新 */
function updateDisplay(){

  const min = Math.floor(totalSeconds / 60);
  const sec = totalSeconds % 60;

  timerEl.textContent =
    String(min).padStart(2,"0")
    + ":"
    + String(sec).padStart(2,"0");

  /* 色変更 */
  if(totalSeconds <= 10){
    timerEl.style.color = "#ff3b30";
  }
  else if(totalSeconds <= 60){
    timerEl.style.color = "#ffd60a";
  }
  else{
    timerEl.style.color = "#ffffff";
  }
}

/* スタート */
function startTimer(){

  if(interval) return;

  interval = setInterval(() => {

    if(totalSeconds > 0){

      totalSeconds--;

      updateDisplay();

      /* 0で停止 */
      if(totalSeconds === 0){

        clearInterval(interval);
        interval = null;

        /* バイブ */
        if(navigator.vibrate){
          navigator.vibrate([300,100,300]);
        }
      }
    }

  },1000);
}

/* 停止 */
function stopTimer(){

  clearInterval(interval);
  interval = null;
}

/* スタート/ストップ切替 */
function toggleTimer(){

  if(interval){
    stopTimer();
  }
  else{
    startTimer();
  }
}

/* リセット */
function resetTimer(){

  clearInterval(interval);

  interval = null;

  totalSeconds = 300;

  updateDisplay();
}

/* 時間タップ */
timerEl.addEventListener("click",toggleTimer);

/* リセット */
resetBtn.addEventListener("click",resetTimer);

/* 初期表示 */
updateDisplay();

</script>

</body>
</html>
