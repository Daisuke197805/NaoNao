<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Watch Start Timer</title>

<style>

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* 上部20%空白 */
#app{
  width:100%;
  height:100%;
  box-sizing:border-box;

  padding-top:20vh;

  display:flex;
  flex-direction:column;
  align-items:center;
}

/* タイマー表示 */
#timer{

  width:88%;
  height:120px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:28px;

  font-size:92px;
  font-weight:700;
  letter-spacing:2px;
  line-height:1;

  user-select:none;
  -webkit-user-select:none;

  touch-action:manipulation;

  margin-bottom:28px;

  transition:
    background-color 0.15s linear,
    color 0.15s linear;
}

/* 点滅用 */
.flash{
  animation:flashAnim 1s steps(1) infinite;
}

@keyframes flashAnim{

  0%{
    background:#ff0000;
    color:#ffffff;
  }

  50%{
    background:#ffffff;
    color:#ff0000;
  }

  100%{
    background:#ff0000;
    color:#ffffff;
  }
}

/* リセットボタン */
#resetBtn{

  width:78%;
  height:54px;

  border:none;
  border-radius:18px;

  font-size:22px;
  font-weight:700;

  background:#7a1f1f;
  color:#fff;

  -webkit-tap-highlight-color:transparent;
}

#resetBtn:active{
  transform:scale(0.98);
}

</style>
</head>

<body>

<div id="app">

  <div id="timer">05:00</div>

  <button id="resetBtn">RESET</button>

</div>

<script>

const timerEl  = document.getElementById("timer");
const resetBtn = document.getElementById("resetBtn");

let totalSeconds = 300;
let interval = null;

/* 表示更新 */
function updateDisplay(){

  const min = Math.floor(totalSeconds / 60);
  const sec = totalSeconds % 60;

  timerEl.textContent =
    String(min).padStart(2,"0")
    + ":"
    + String(sec).padStart(2,"0");

  /* 点滅解除 */
  timerEl.classList.remove("flash");

  /* 5分〜2分 青 */
  if(totalSeconds > 120){

    timerEl.style.background = "#007aff";
    timerEl.style.color = "#ffffff";
  }

  /* 2分〜1分 黄 */
  else if(totalSeconds > 60){

    timerEl.style.background = "#ffd60a";
    timerEl.style.color = "#000000";
  }

  /* 1分〜30秒 赤 */
  else if(totalSeconds > 30){

    timerEl.style.background = "#ff3b30";
    timerEl.style.color = "#ffffff";
  }

  /* 30秒以下 点滅 */
  else{

    timerEl.classList.add("flash");
  }
}

/* スタート */
function startTimer(){

  if(interval) return;

  interval = setInterval(() => {

    if(totalSeconds > 0){

      totalSeconds--;

      updateDisplay();

      /* 0で停止 */
      if(totalSeconds === 0){

        clearInterval(interval);
        interval = null;

        if(navigator.vibrate){
          navigator.vibrate([300,100,300]);
        }
      }
    }

  },1000);
}

/* 停止 */
function stopTimer(){

  clearInterval(interval);
  interval = null;
}

/* スタート/停止切替 */
function toggleTimer(){

  if(interval){
    stopTimer();
  }
  else{
    startTimer();
  }
}

/* リセット */
function resetTimer(){

  clearInterval(interval);

  interval = null;

  totalSeconds = 300;

  updateDisplay();
}

/* タップ */
timerEl.addEventListener("click",toggleTimer);

/* リセット */
resetBtn.addEventListener("click",resetTimer);

/* 初期表示 */
updateDisplay();

</script>

</body>
</html>
