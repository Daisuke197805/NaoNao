<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行支出</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0 16px;
    }

    .total {
      background: #222;
      color: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .total-label {
      font-size: 15px;
    }

    .total-value {
      font-size: 36px;
      font-weight: bold;
      margin-top: 4px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .payers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .payer {
      padding: 14px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 17px;
      font-weight: bold;
    }

    .payer.selected {
      background: #222;
      color: white;
      border-color: #222;
    }

    .add-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-size: 19px;
      font-weight: bold;
    }

    .add-button:disabled {
      background: #aaa;
    }

    .expense {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .expense:last-child {
      border-bottom: none;
    }

    .expense-main {
      min-width: 0;
    }

    .expense-item {
      font-weight: bold;
    }

    .expense-time {
      font-size: 13px;
      color: #777;
      margin-top: 3px;
    }

    .expense-right {
      text-align: right;
      margin-left: 10px;
      white-space: nowrap;
    }

    .expense-amount {
      font-weight: bold;
    }

    .expense-payer {
      font-size: 13px;
      color: #777;
    }

    .message {
      text-align: center;
      margin: 10px 0;
      color: #666;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>旅行支出</h1>

  <div class="total">
    <div class="total-label">現在の合計</div>
    <div class="total-value" id="total">¥0</div>
  </div>

  <div class="card">

    <label>項目名</label>
    <input
      type="text"
      id="item"
      placeholder="例：昼食"
    >

    <label>金額</label>
    <input
      type="number"
      id="amount"
      placeholder="例：8000"
      inputmode="numeric"
    >

    <label>支払い者</label>

    <div class="payers">
      <button class="payer" data-payer="だいすけ">だいすけ</button>
      <button class="payer" data-payer="ふじも">ふじも</button>
      <button class="payer" data-payer="ちかこ">ちかこ</button>
      <button class="payer" data-payer="みか">みか</button>
    </div>

    <button class="add-button" id="addButton">
      支出を追加
    </button>

    <div class="message" id="message"></div>

  </div>

  <div class="card">
    <h2>支出履歴</h2>
    <div id="expenses"></div>
  </div>

</div>


<script>

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzFjI0OFtxkwU_Uo5y2DVzG0mf7hnnv3evzlC05htrP8j4XgcZBF8Kow4mmpQWYyjv2jQ/exec";

let selectedPayer = "";


/* 支払い者ボタン */

document.querySelectorAll(".payer").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".payer").forEach(b => {
      b.classList.remove("selected");
    });

    button.classList.add("selected");

    selectedPayer = button.dataset.payer;

  });

});


/* 支出を追加 */

document.getElementById("addButton").addEventListener("click", async () => {

  const item = document.getElementById("item").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!item) {
    alert("項目名を入力してください");
    return;
  }

  if (!amount || amount <= 0) {
    alert("金額を入力してください");
    return;
  }

  if (!selectedPayer) {
    alert("支払い者を選択してください");
    return;
  }

  const button = document.getElementById("addButton");
  const message = document.getElementById("message");

  button.disabled = true;
  message.textContent = "保存中...";

  try {

    await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({
        item: item,
        amount: amount,
        payer: selectedPayer
      })
    });

    document.getElementById("item").value = "";
    document.getElementById("amount").value = "";

    document.querySelectorAll(".payer").forEach(b => {
      b.classList.remove("selected");
    });

    selectedPayer = "";

    message.textContent = "追加しました";

    loadExpenses();

  } catch (error) {

    console.error(error);
    message.textContent = "保存に失敗しました";

  }

  button.disabled = false;

});


/* 支出データ取得 */

async function loadExpenses() {

  try {

    const response = await fetch(GAS_URL);
    const data = await response.json();

    displayExpenses(data);

  } catch (error) {

    console.error(error);

    document.getElementById("expenses").textContent =
      "データを取得できませんでした";

  }

}


/* 表示 */

function displayExpenses(data) {

  const expenses = document.getElementById("expenses");

  expenses.innerHTML = "";

  let total = 0;

  data.reverse().forEach(expense => {

    total += Number(expense.amount);

    const div = document.createElement("div");

    div.className = "expense";

    const date = new Date(expense.datetime);

    const time =
      (date.getMonth() + 1) + "/" +
      date.getDate() + " " +
      String(date.getHours()).padStart(2, "0") + ":" +
      String(date.getMinutes()).padStart(2, "0");

    div.innerHTML = `
      <div class="expense-main">
        <div class="expense-item">${expense.item}</div>
        <div class="expense-time">${time}</div>
      </div>

      <div class="expense-right">
        <div class="expense-amount">
          ¥${Number(expense.amount).toLocaleString()}
        </div>
        <div class="expense-payer">
          ${expense.payer}
        </div>
      </div>
    `;

    expenses.appendChild(div);

  });

  document.getElementById("total").textContent =
    "¥" + total.toLocaleString();

}


/* 起動時にデータ取得 */

loadExpenses();

</script>

</body>
</html>
