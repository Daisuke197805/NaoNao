<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行支出</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0 16px;
    }

    /* モード切替 */

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: white;
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .mode-button {
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: white;
      font-size: 17px;
      font-weight: bold;
      color: #666;
    }

    .mode-button.active {
      background: #222;
      color: white;
    }

    /* 共通カード */

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
    }

    /* 合計 */

    .total {
      background: #222;
      color: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .total-label {
      font-size: 15px;
    }

    .total-value {
      font-size: 36px;
      font-weight: bold;
      margin-top: 4px;
    }

    /* 支払者別合計 */

    .payer-totals {
      margin-top: 16px;
      border-top: 1px solid #555;
      padding-top: 10px;
    }

    .payer-totals div {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 16px;
    }

    .payer-totals strong {
      font-size: 17px;
    }

    /* 入力 */

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    /* 支払い者ボタン */

    .payers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .payer {
      padding: 14px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background: white;
      font-size: 17px;
      font-weight: bold;
    }

    .payer.selected {
      background: #222;
      color: white;
      border-color: #222;
    }

    /* 追加ボタン */

    .add-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-size: 19px;
      font-weight: bold;
    }

    .add-button:disabled {
      background: #aaa;
    }

    /* メッセージ */

    .message {
      text-align: center;
      margin: 10px 0;
      color: #666;
      min-height: 20px;
    }

    /* 支出履歴 */

    .expense {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .expense:last-child {
      border-bottom: none;
    }

    .expense-main {
      min-width: 0;
    }

    .expense-item {
      font-weight: bold;
      word-break: break-word;
    }

    .expense-time {
      font-size: 13px;
      color: #777;
      margin-top: 3px;
    }

    .expense-right {
      text-align: right;
      margin-left: 10px;
      white-space: nowrap;
    }

    .expense-amount {
      font-weight: bold;
    }

    .expense-payer {
      font-size: 13px;
      color: #777;
    }

    /* 削除ボタン */

    .delete-button {
      margin-top: 6px;
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #d00;
      font-size: 13px;
    }

    .delete-button:disabled {
      color: #999;
    }

    /* 精算画面 */

    .settlement-summary {
      text-align: center;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid #eee;
    }

    .settlement-total-label {
      font-size: 14px;
      color: #666;
    }

    .settlement-total {
      font-size: 30px;
      font-weight: bold;
      margin: 4px 0 12px;
    }

    .per-person {
      font-size: 15px;
      color: #555;
    }

    /* 精算状況 */

    .balance-list {
      margin-bottom: 20px;
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .balance-row:last-child {
      border-bottom: none;
    }

    .balance-name {
      font-weight: bold;
    }

    .balance-amount {
      font-weight: bold;
    }

    .balance-plus {
      color: #007aff;
    }

    .balance-minus {
      color: #d00;
    }

    .balance-even {
      color: #777;
    }

    /* 精算方法 */

    .settlement-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 12px;
    }

    .settlement-row {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .settlement-names {
      font-size: 16px;
      font-weight: bold;
    }

    .settlement-arrow {
      margin: 0 5px;
      color: #777;
    }

    .settlement-amount {
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
    }

    .no-settlement {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }

    .empty-history {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>旅行支出（台湾ドル）</h1>

  <!-- モード切替 -->

  <div class="mode-switch">

    <button
      class="mode-button active"
      id="expenseModeButton">
      支出
    </button>

    <button
      class="mode-button"
      id="settlementModeButton">
      精算
    </button>

  </div>


  <!-- ========================= -->
  <!-- 支出モード -->
  <!-- ========================= -->

  <div id="expenseMode">

    <!-- 合計 -->

    <div class="total">

      <div class="total-label">
        現在の合計
      </div>

      <div class="total-value" id="total">
        NT$ 0
      </div>

      <div class="payer-totals">

        <div>
          <span>だいすけ</span>
          <strong id="total-daisuke">NT$ 0</strong>
        </div>

        <div>
          <span>ふじも</span>
          <strong id="total-fujimo">NT$ 0</strong>
        </div>

        <div>
          <span>ちかこ</span>
          <strong id="total-chikako">NT$ 0</strong>
        </div>

        <div>
          <span>みか</span>
          <strong id="total-mika">NT$ 0</strong>
        </div>

      </div>

    </div>


    <!-- 支出入力 -->

    <div class="card">

      <label>項目名</label>

      <input
        type="text"
        id="item"
        placeholder="例：昼食"
      >


      <label>金額</label>

      <input
        type="number"
        id="amount"
        placeholder="例：800"
        inputmode="numeric"
      >


      <label>支払い者</label>

      <div class="payers">

        <button
          class="payer"
          data-payer="だいすけ">
          だいすけ
        </button>

        <button
          class="payer"
          data-payer="ふじも">
          ふじも
        </button>

        <button
          class="payer"
          data-payer="ちかこ">
          ちかこ
        </button>

        <button
          class="payer"
          data-payer="みか">
          みか
        </button>

      </div>


      <button
        class="add-button"
        id="addButton">
        支出を追加
      </button>


      <div
        class="message"
        id="message">
      </div>

    </div>


    <!-- 支出履歴 -->

    <div class="card">

      <h2>支出履歴</h2>

      <div id="expenses"></div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- 精算モード -->
  <!-- ========================= -->

  <div id="settlementMode" style="display:none;">

    <div class="card">

      <div class="settlement-summary">

        <div class="settlement-total-label">
          総支出
        </div>

        <div
          class="settlement-total"
          id="settlementTotal">
          NT$ 0
        </div>

        <div class="per-person">
          1人あたりの負担額：
          <strong id="perPerson">
            NT$ 0
          </strong>
        </div>

      </div>


      <h2>支払い状況</h2>

      <div
        class="balance-list"
        id="balanceList">
      </div>


      <h2 class="settlement-title">
        精算方法
      </h2>

      <div
        id="settlementList">
      </div>

    </div>

  </div>

</div>


<script>

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzFjI0OFtxkwU_Uo5y2DVzG0mf7hnnv3evzlC05htrP8j4XgcZBF8Kow4mmpQWYyjv2jQ/exec";


let selectedPayer = "";

let expenseData = [];


/* =========================
   モード切替
========================= */

const expenseModeButton =
  document.getElementById("expenseModeButton");

const settlementModeButton =
  document.getElementById("settlementModeButton");

const expenseMode =
  document.getElementById("expenseMode");

const settlementMode =
  document.getElementById("settlementMode");


expenseModeButton.addEventListener("click", () => {

  expenseMode.style.display = "block";
  settlementMode.style.display = "none";

  expenseModeButton.classList.add("active");
  settlementModeButton.classList.remove("active");

});


settlementModeButton.addEventListener("click", () => {

  expenseMode.style.display = "none";
  settlementMode.style.display = "block";

  expenseModeButton.classList.remove("active");
  settlementModeButton.classList.add("active");

  updateSettlement();

});


/* =========================
   支払い者ボタン
========================= */

document.querySelectorAll(".payer").forEach(button => {

  button.addEventListener("click", () => {

    document.querySelectorAll(".payer").forEach(b => {
      b.classList.remove("selected");
    });

    button.classList.add("selected");

    selectedPayer = button.dataset.payer;

  });

});


/* =========================
   支出を追加
========================= */

document.getElementById("addButton").addEventListener("click", async () => {

  const item =
    document.getElementById("item").value.trim();

  const amount =
    Number(document.getElementById("amount").value);


  if (!item) {

    alert("項目名を入力してください");
    return;

  }


  if (!amount || amount <= 0) {

    alert("金額を入力してください");
    return;

  }


  if (!selectedPayer) {

    alert("支払い者を選択してください");
    return;

  }


  const button =
    document.getElementById("addButton");

  const message =
    document.getElementById("message");


  button.disabled = true;

  message.textContent = "保存中...";


  try {

    await fetch(GAS_URL, {

      method: "POST",

      body: JSON.stringify({

        item: item,

        amount: amount,

        payer: selectedPayer

      })

    });


    document.getElementById("item").value = "";

    document.getElementById("amount").value = "";


    document.querySelectorAll(".payer").forEach(b => {

      b.classList.remove("selected");

    });


    selectedPayer = "";


    message.textContent = "追加しました";


    await loadExpenses();


  } catch (error) {

    console.error(error);

    message.textContent =
      "保存に失敗しました";

  }


  button.disabled = false;

});


/* =========================
   支出データ取得
========================= */

async function loadExpenses() {

  try {

    const response =
      await fetch(GAS_URL);

    const data =
      await response.json();

    expenseData = data;

    displayExpenses(data);

    updateSettlement();

  } catch (error) {

    console.error(error);

    document.getElementById("expenses").textContent =
      "データを取得できませんでした";

  }

}


/* =========================
   支出履歴表示
========================= */

function displayExpenses(data) {

  const expenses =
    document.getElementById("expenses");


  expenses.innerHTML = "";


  if (data.length === 0) {

    expenses.innerHTML =
      '<div class="empty-history">まだ支出はありません</div>';

  }


  let total = 0;


  const payerTotals = {

    "だいすけ": 0,

    "ふじも": 0,

    "ちかこ": 0,

    "みか": 0

  };


  [...data]
    .reverse()
    .forEach(expense => {


      const amount =
        Number(expense.amount);


      total += amount;


      if (
        payerTotals.hasOwnProperty(expense.payer)
      ) {

        payerTotals[expense.payer] += amount;

      }


      const div =
        document.createElement("div");


      div.className = "expense";


      const date =
        new Date(expense.datetime);


      const time =

        (date.getMonth() + 1) +
        "/" +
        date.getDate() +
        " " +
        String(date.getHours()).padStart(2, "0") +
        ":" +
        String(date.getMinutes()).padStart(2, "0");


      div.innerHTML = `

        <div class="expense-main">

          <div class="expense-item">
            ${escapeHtml(expense.item)}
          </div>

          <div class="expense-time">
            ${time}
          </div>

        </div>


        <div class="expense-right">

          <div class="expense-amount">
            NT$ ${amount.toLocaleString()}
          </div>

          <div class="expense-payer">
            ${escapeHtml(expense.payer)}
          </div>

          <button
            class="delete-button"
            data-id="${expense.id}">
            削除
          </button>

        </div>

      `;


      expenses.appendChild(div);


      /* 削除処理 */

      const deleteButton =
        div.querySelector(".delete-button");


      deleteButton.addEventListener(
        "click",
        async () => {


          const confirmed =
            confirm(

              "この支出を削除しますか？\n\n" +

              expense.item +

              "　NT$ " +

              amount.toLocaleString()

            );


          if (!confirmed) {
            return;
          }


          deleteButton.disabled = true;

          deleteButton.textContent =
            "削除中...";


          try {

            const response =
              await fetch(GAS_URL, {

                method: "POST",

                body: JSON.stringify({

                  action: "delete",

                  id: expense.id

                })

              });


            const result =
              await response.json();


            if (result.success) {

              await loadExpenses();

            } else {

              alert(
                "削除できませんでした"
              );

              deleteButton.disabled = false;

              deleteButton.textContent =
                "削除";

            }


          } catch (error) {

            console.error(error);

            alert(
              "削除に失敗しました"
            );

            deleteButton.disabled = false;

            deleteButton.textContent =
              "削除";

          }

        }
      );

    });


  document.getElementById("total").textContent =
    "NT$ " + total.toLocaleString();


  document.getElementById("total-daisuke").textContent =
    "NT$ " +
    payerTotals["だいすけ"].toLocaleString();


  document.getElementById("total-fujimo").textContent =
    "NT$ " +
    payerTotals["ふじも"].toLocaleString();


  document.getElementById("total-chikako").textContent =
    "NT$ " +
    payerTotals["ちかこ"].toLocaleString();


  document.getElementById("total-mika").textContent =
    "NT$ " +
    payerTotals["みか"].toLocaleString();

}


/* =========================
   精算計算
========================= */

function updateSettlement() {

  const people = [
    "だいすけ",
    "ふじも",
    "ちかこ",
    "みか"
  ];


  const paid = {

    "だいすけ": 0,

    "ふじも": 0,

    "ちかこ": 0,

    "みか": 0

  };


  let total = 0;


  expenseData.forEach(expense => {

    const amount =
      Number(expense.amount) || 0;


    total += amount;


    if (paid.hasOwnProperty(expense.payer)) {

      paid[expense.payer] += amount;

    }

  });


  const perPerson =
    total / people.length;


  document.getElementById("settlementTotal").textContent =
    "NT$ " + total.toLocaleString();


  document.getElementById("perPerson").textContent =
    "NT$ " +
    formatAmount(perPerson);


  /* 支払い状況 */

  const balanceList =
    document.getElementById("balanceList");


  balanceList.innerHTML = "";


  people.forEach(person => {

    const balance =
      paid[person] - perPerson;


    const row =
      document.createElement("div");


    row.className =
      "balance-row";


    let amountText = "";

    let amountClass =
      "balance-even";


    if (balance > 0.0001) {

      amountText =
        "+NT$ " +
        formatAmount(balance);

      amountClass =
        "balance-plus";

    } else if (balance < -0.0001) {

      amountText =
        "-NT$ " +
        formatAmount(Math.abs(balance));

      amountClass =
        "balance-minus";

    } else {

      amountText =
        "±NT$ 0";

    }


    row.innerHTML = `

      <span class="balance-name">
        ${person}
      </span>

      <span class="balance-amount ${amountClass}">
        ${amountText}
      </span>

    `;


    balanceList.appendChild(row);

  });


  /* 精算方法 */

  calculateSettlement(paid, perPerson, people);

}


/* =========================
   誰が誰に払うか計算
========================= */

function calculateSettlement(
  paid,
  perPerson,
  people
) {


  const settlementList =
    document.getElementById("settlementList");


  settlementList.innerHTML = "";


  if (perPerson === 0) {

    settlementList.innerHTML =
      '<div class="no-settlement">まだ支出がありません</div>';

    return;

  }


  /*
    balance > 0
    → 受け取る側

    balance < 0
    → 支払う側
  */

  const creditors = [];

  const debtors = [];


  people.forEach(person => {

    const balance =
      paid[person] - perPerson;


    if (balance > 0.0001) {

      creditors.push({

        name: person,

        amount: balance

      });

    }


    if (balance < -0.0001) {

      debtors.push({

        name: person,

        amount: Math.abs(balance)

      });

    }

  });


  /*
    金額の大きい順に並べる
  */

  creditors.sort(
    (a, b) => b.amount - a.amount
  );


  debtors.sort(
    (a, b) => b.amount - a.amount
  );


  const transactions = [];


  let i = 0;

  let j = 0;


  while (
    i < debtors.length &&
    j < creditors.length
  ) {


    const debtor =
      debtors[i];


    const creditor =
      creditors[j];


    const amount =
      Math.min(
        debtor.amount,
        creditor.amount
      );


    if (amount > 0.0001) {

      transactions.push({

        from: debtor.name,

        to: creditor.name,

        amount: amount

      });

    }


    debtor.amount -= amount;

    creditor.amount -= amount;


    if (
      debtor.amount < 0.0001
    ) {

      i++;

    }


    if (
      creditor.amount < 0.0001
    ) {

      j++;

    }

  }


  if (transactions.length === 0) {

    settlementList.innerHTML =
      '<div class="no-settlement">精算はありません</div>';

    return;

  }


  transactions.forEach(transaction => {

    const row =
      document.createElement("div");


    row.className =
      "settlement-row";


    row.innerHTML = `

      <div class="settlement-names">

        ${transaction.from}

        <span class="settlement-arrow">
          →
        </span>

        ${transaction.to}

      </div>

      <div class="settlement-amount">

        NT$ ${formatAmount(transaction.amount)}

      </div>

    `;


    settlementList.appendChild(row);

  });

}


/* =========================
   金額表示
========================= */

function formatAmount(amount) {

  /*
    台湾ドルは通常整数で扱うため、
    小数が出ないよう四捨五入
  */

  return Math.round(amount).toLocaleString();

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   起動時
========================= */

loadExpenses();

</script>

</body>
</html>
