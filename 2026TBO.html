<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>東京ベイオープン・シミュレーター</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* モバイル特化のスタイル調整 */
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        select, input, button {
            touch-action: manipulation;
        }
        /* スクロールバー非表示（スッキリさせるため） */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-20">

    <!-- 固定ヘッダー -->
    <header class="fixed top-0 left-0 right-0 bg-slate-800 border-b border-slate-700 z-50 px-4 py-3 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="text-xl">⛵</div>
            <h1 class="text-sm font-bold text-white leading-tight">
                東京ベイオープン<br>
                <span class="text-[10px] text-cyan-400 font-normal">レーティングシミュレーター</span>
            </h1>
        </div>
        <button id="btn-share" class="bg-cyan-600 hover:bg-cyan-500 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg shadow-sm">
            結果コピー
        </button>
    </header>

    <!-- メインコンテンツ (ヘッダーの高さ分下げる) -->
    <main class="pt-16 px-3 max-w-lg mx-auto space-y-4">

        <!-- 1. 基準設定セクション -->
        <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-lg relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-cyan-500"></div>
            
            <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-1.5">
                🧭 基準艇と所要時間
            </h2>

            <!-- 自艇選択 -->
            <div class="mb-4">
                <select id="select-myboat" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm text-slate-100 font-bold appearance-none">
                    <!-- JSで描画 -->
                </select>
            </div>

            <!-- 時間入力 (ハイブリッドUI) -->
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 mb-3">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-slate-400">実所要時間</span>
                    <button id="btn-reset-time" class="text-[10px] text-slate-500 bg-slate-800 px-2 py-1 rounded">3時間に戻す</button>
                </div>

                <div class="flex justify-between items-center gap-2 text-center">
                    <!-- 時 -->
                    <div class="flex-1 flex flex-col">
                        <span class="text-[10px] text-slate-500 mb-1">時(H)</span>
                        <div class="flex bg-slate-800 rounded overflow-hidden">
                            <button id="btn-h-minus" class="w-8 h-10 bg-slate-700 text-white font-bold active:bg-slate-600">-</button>
                            <div id="val-h" class="flex-1 flex items-center justify-center font-bold text-lg">3</div>
                            <button id="btn-h-plus" class="w-8 h-10 bg-slate-700 text-white font-bold active:bg-slate-600">+</button>
                        </div>
                    </div>
                    <!-- 分 -->
                    <div class="flex-1 flex flex-col">
                        <span class="text-[10px] text-slate-500 mb-1">分(M)</span>
                        <div class="flex bg-slate-800 rounded overflow-hidden">
                            <button id="btn-m-minus" class="w-8 h-10 bg-slate-700 text-white font-bold active:bg-slate-600">-</button>
                            <div id="val-m" class="flex-1 flex items-center justify-center font-bold text-lg">0</div>
                            <button id="btn-m-plus" class="w-8 h-10 bg-slate-700 text-white font-bold active:bg-slate-600">+</button>
                        </div>
                    </div>
                    <!-- 秒 -->
                    <div class="flex-1 flex flex-col">
                        <span class="text-[10px] text-slate-500 mb-1">秒(S)</span>
                        <div class="flex bg-slate-800 rounded overflow-hidden">
                            <button id="btn-s-minus" class="w-8 h-10 bg-slate-700 text-white font-bold active:bg-slate-600">-</button>
                            <div id="val-s" class="flex-1 flex items-center justify-center font-bold text-lg">0</div>
                            <button id="btn-s-plus" class="w-8 h-10 bg-slate-700 text-white font-bold active:bg-slate-600">+</button>
                        </div>
                    </div>
                </div>

                <!-- 1分・10分ショートカット -->
                <div class="grid grid-cols-4 gap-1.5 mt-3">
                    <button id="btn-sub-10m" class="bg-slate-700 active:bg-slate-600 text-white text-xs py-2 rounded">-10分</button>
                    <button id="btn-sub-1m" class="bg-slate-700 active:bg-slate-600 text-white text-xs py-2 rounded">-1分</button>
                    <button id="btn-add-1m" class="bg-slate-700 active:bg-slate-600 text-white text-xs py-2 rounded">+1分</button>
                    <button id="btn-add-10m" class="bg-slate-700 active:bg-slate-600 text-white text-xs py-2 rounded">+10分</button>
                </div>
            </div>

            <!-- サマリー表示 -->
            <div class="flex justify-between items-center p-3 bg-cyan-900/30 border border-cyan-800/50 rounded-lg">
                <div>
                    <span class="text-[11px] text-cyan-400 font-bold block">自艇の修正時間</span>
                    <span id="summary-tcf" class="text-slate-500 text-[9px]">TCF: 0.000</span>
                </div>
                <div class="text-right">
                    <div id="summary-corrected-time" class="text-lg font-bold text-cyan-300 font-mono">00:00:00</div>
                </div>
            </div>
        </section>

        <!-- 2. フィルターセクション -->
        <section class="bg-slate-800 rounded-xl p-3 border border-slate-700 shadow-md">
            <!-- 検索 -->
            <div class="mb-2">
                <input type="text" id="input-search" placeholder="🔍 艇名、セール№で検索..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500">
            </div>
            <!-- グループ -->
            <div class="flex gap-1 overflow-x-auto pb-1 mb-1">
                <span class="text-slate-500 text-[10px] flex items-center pr-1 whitespace-nowrap">グループ</span>
                <div id="filter-group-container" class="flex gap-1"></div>
            </div>
            <!-- クラス -->
            <div class="flex gap-1 overflow-x-auto pb-1">
                <span class="text-slate-500 text-[10px] flex items-center pr-1 whitespace-nowrap">クラス</span>
                <div id="filter-class-container" class="flex gap-1"></div>
            </div>
        </section>

        <!-- 件数表示 -->
        <div class="text-[10px] text-slate-400 px-1 flex justify-between">
            <span id="count-display">該当: 0 艇</span>
            <span>※ 目標時間はイーブンになる実所要時間</span>
        </div>

        <!-- 3. 結果リストセクション -->
        <section id="result-list" class="space-y-3 pb-8">
            <!-- JSでカードを描画 -->
        </section>

    </main>

    <!-- コピー完了通知 (非表示) -->
    <div id="toast-copy" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-4 py-2 rounded-full shadow-lg text-xs font-bold transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        📋 結果をコピーしました！
    </div>

            { id: 41, group: "C", class: "Ⅴ", sail: "6310", name: "SAKURA", type: "Ｊ２４", tcf: 0.702, port: "浦安" },
            { id: 42, group: "C", class: "Ⅴ", sail: "4776", name: "LIBERTY", type: "ヤマハ ２８Ｓ", tcf: 0.701, port: "船橋" },
            { id: 43, group: "C", class: "Ⅴ", sail: "6112", name: "I'll go", type: "ヤマハ ２８Ｓ", tcf: 0.699, port: "夢の島" },
            { id: 44, group: "C", class: "Ⅴ", sail: "6736", name: "SAKURA", type: "ヤマハ２８S", tcf: 0.699, port: "浦安" },
            { id: 45, group: "C", class: "Ⅴ", sail: "-", name: "Milky Way Ⅲ", type: "ヤマハ ２８Ｓ", tcf: 0.699, port: "船橋" },
            { id: 46, group: "C", class: "Ⅴ", sail: "7172", name: "LAHAINA Ⅳ", type: "ヤマハ ２８Ｓ", tcf: 0.699, port: "船橋" },
            { id: 47, group: "C", class: "Ⅴ", sail: "5510", name: "NANUAQ", type: "ＯＫＡＺＡＫＩ 33", tcf: 0.698, port: "YBM" },
            { id: 48, group: "C", class: "Ⅴ", sail: "-", name: "AQUA", type: "林オーシャンブルー９９0", tcf: 0.696, port: "夢の島" },
            { id: 49, group: "C", class: "Ⅴ", sail: "-", name: "PANDORA4", type: "ＴＲＥＫＫＥＲ３４", tcf: 0.696, port: "浦安" },
            { id: 50, group: "C", class: "Ⅴ", sail: "4468", name: "FELIX", type: "Ｊ２４", tcf: 0.696, port: "ＹＹＣ" },
            { id: 51, group: "C", class: "Ⅴ", sail: "7054", name: "AURA", type: "オークレット２６ P", tcf: 0.696, port: "船橋" }
        ];

        // 状態（State）
        let state = {
            myBoatId: 26, // デフォルト: naonao
            h: 3,
            m: 0,
            s: 0,
            group: 'All',
            class: 'All',
            search: ''
        };

        // DOM要素の取得
        const elSelect = document.getElementById('select-myboat');
        const elValH = document.getElementById('val-h');
        const elValM = document.getElementById('val-m');
        const elValS = document.getElementById('val-s');
        const elSummaryTcf = document.getElementById('summary-tcf');
        const elSummaryCT = document.getElementById('summary-corrected-time');
        const elResultList = document.getElementById('result-list');
        const elCount = document.getElementById('count-display');
        const elFilterGroup = document.getElementById('filter-group-container');
        const elFilterClass = document.getElementById('filter-class-container');
        const elSearch = document.getElementById('input-search');

        // フォーマット関数
        function formatDigital(totalSeconds) {
            const isNegative = totalSeconds < 0;
            const abs = Math.abs(Math.round(totalSeconds));
            const h = String(Math.floor(abs / 3600)).padStart(2, '0');
            const m = String(Math.floor((abs % 3600) / 60)).padStart(2, '0');
            const s = String(abs % 60).padStart(2, '0');
            return `${isNegative ? '-' : ''}${h}:${m}:${s}`;
        }

        // 初期化処理
        function init() {
            // セレクトボックスの生成
            FLEET.forEach(boat => {
                const opt = document.createElement('option');
                opt.value = boat.id;
                opt.textContent = `${boat.id === 26 ? '👑 ' : ''}${boat.name} (TCF: ${boat.tcf.toFixed(3)})`;
                if(boat.id === state.myBoatId) opt.selected = true;
                elSelect.appendChild(opt);
            });

            // フィルターボタン生成
            const groups = ['All', 'A', 'B', 'C'];
            groups.forEach(g => {
                const btn = document.createElement('button');
                btn.textContent = g === 'All' ? '全' : g;
                btn.className = 'px-2 py-1 rounded text-xs font-bold border transition-colors ' + (state.group === g ? 'bg-cyan-500 text-slate-900 border-cyan-400' : 'bg-slate-900 text-slate-400 border-slate-700');
                btn.onclick = () => { state.group = g; renderFilters(); renderList(); };
                elFilterGroup.appendChild(btn);
            });

            const classes = ['All', 'Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ'];
            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.textContent = c === 'All' ? '全' : c;
                btn.className = 'px-2 py-1 rounded text-xs font-bold border transition-colors ' + (state.class === c ? 'bg-blue-500 text-white border-blue-400' : 'bg-slate-900 text-slate-400 border-slate-700');
                btn.onclick = () => { state.class = c; renderFilters(); renderList(); };
                elFilterClass.appendChild(btn);
            });

            // イベントリスナーの登録
            elSelect.addEventListener('change', (e) => {
                state.myBoatId = parseInt(e.target.value);
                renderAll();
            });

            elSearch.addEventListener('input', (e) => {
                state.search = e.target.value.toLowerCase();
                renderList();
            });

            // 時間調整ボタン
            const adjustTime = (addH, addM, addS) => {
                let totalS = (state.h * 3600) + (state.m * 60) + state.s;
                totalS += (addH * 3600) + (addM * 60) + addS;
                if(totalS < 0) totalS = 0;
                
                state.h = Math.floor(totalS / 3600);
                state.m = Math.floor((totalS % 3600) / 60);
                state.s = totalS % 60;
                renderAll();
            };

            document.getElementById('btn-h-minus').onclick = () => adjustTime(-1, 0, 0);
            document.getElementById('btn-h-plus').onclick = () => adjustTime(1, 0, 0);
            document.getElementById('btn-m-minus').onclick = () => adjustTime(0, -1, 0);
            document.getElementById('btn-m-plus').onclick = () => adjustTime(0, 1, 0);
            document.getElementById('btn-s-minus').onclick = () => adjustTime(0, 0, -1);
            document.getElementById('btn-s-plus').onclick = () => adjustTime(0, 0, 1);

            document.getElementById('btn-sub-10m').onclick = () => adjustTime(0, -10, 0);
            document.getElementById('btn-sub-1m').onclick = () => adjustTime(0, -1, 0);
            document.getElementById('btn-add-1m').onclick = () => adjustTime(0, 1, 0);
            document.getElementById('btn-add-10m').onclick = () => adjustTime(0, 10, 0);

            document.getElementById('btn-reset-time').onclick = () => {
                state.h = 3; state.m = 0; state.s = 0;
                renderAll();
            };

            // コピー機能
            document.getElementById('btn-share').onclick = () => {
                const myB = FLEET.find(b => b.id === state.myBoatId);
                const tS = (state.h * 3600) + (state.m * 60) + state.s;
                const cS = tS * myB.tcf;
                
                let text = `基準: ${myB.name}\n所要: ${formatDigital(tS)}\n修正: ${formatDigital(cS)}\n\n【ライバル目標時間】\n`;
                const filtered = getFilteredFleet().filter(b => b.id !== state.myBoatId).slice(0, 5);
                filtered.forEach(b => {
                    const tar = cS / b.tcf;
                    const gap = tar - tS;
                    text += `・${b.name}: ${formatDigital(tar)} (${gap >= 0 ? '+' : ''}${Math.round(gap)}秒)\n`;
                });

                const temp = document.createElement("textarea");
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                document.body.removeChild(temp);

                const toast = document.getElementById('toast-copy');
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 2000);
            };

            // 初回描画
            renderAll();
        }

        // フィルターボタンの見た目更新
        function renderFilters() {
            Array.from(elFilterGroup.children).forEach(btn => {
                const g = btn.textContent === '全' ? 'All' : btn.textContent;
                btn.className = 'px-3 py-1 rounded text-xs font-bold border transition-colors ' + (state.group === g ? 'bg-cyan-500 text-slate-900 border-cyan-400' : 'bg-slate-900 text-slate-400 border-slate-700');
            });
            Array.from(elFilterClass.children).forEach(btn => {
                const c = btn.textContent === '全' ? 'All' : btn.textContent;
                btn.className = 'px-3 py-1 rounded text-xs font-bold border transition-colors ' + (state.class === c ? 'bg-blue-500 text-white border-blue-400' : 'bg-slate-900 text-slate-400 border-slate-700');
            });
        }

        // 絞り込みとソート処理
        function getFilteredFleet() {
            const myBoat = FLEET.find(b => b.id === state.myBoatId);
            const totalS = (state.h * 3600) + (state.m * 60) + state.s;
            const myCorS = totalS * myBoat.tcf;

            let result = FLEET.filter(b => {
                const matchG = state.group === 'All' || b.group === state.group;
                const matchC = state.class === 'All' || b.class === state.class;
                const matchS = state.search === '' || b.name.toLowerCase().includes(state.search) || b.sail.includes(state.search);
                return matchG && matchC && matchS;
            });

            // 今回は TCF 降順固定でシンプルにする
            result.sort((a, b) => b.tcf - a.tcf);
            return result;
        }

        // リスト描画
        function renderList() {
            const list = getFilteredFleet();
            const myBoat = FLEET.find(b => b.id === state.myBoatId);
            const totalS = (state.h * 3600) + (state.m * 60) + state.s;
            const myCorS = totalS * myBoat.tcf;

            elCount.textContent = `該当: ${list.length} 艇`;
            elResultList.innerHTML = '';

            if(list.length === 0) {
                elResultList.innerHTML = '<div class="text-center text-slate-500 text-sm py-8">該当する艇がありません。</div>';
                return;
            }

            list.forEach(boat => {
                const isSelf = boat.id === myBoat.id;
                
                // 計算
                const targetTime = myCorS / boat.tcf;
                const timeGap = targetTime - totalS;
                const convertedTime = totalS * boat.tcf;
                const gapToEven = myCorS - convertedTime;

                // カードHTML構築
                const card = document.createElement('div');
                card.className = `bg-slate-800 rounded-xl p-3 border shadow-sm ${isSelf ? 'border-cyan-500 bg-cyan-950/20' : 'border-slate-700'}`;
                
                let html = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div class="flex items-center gap-1">
                                ${isSelf ? '<span class="text-cyan-400 text-sm">👑</span>' : ''}
                                <span class="font-bold text-slate-100 text-sm">${boat.name}</span>
                                <span class="text-[10px] text-slate-500">#${boat.sail}</span>
                            </div>
                            <div class="text-[10px] text-slate-400 mt-0.5">${boat.type}</div>
                        </div>
                        <div class="text-right">
                            <span class="bg-slate-900 text-slate-300 text-[9px] px-1.5 py-0.5 rounded border border-slate-700">${boat.group}G / ${boat.class}C</span>
                            <div class="text-[10px] text-slate-400 mt-1">TCF: <span class="text-slate-200 font-bold">${boat.tcf.toFixed(3)}</span></div>
                        </div>
                    </div>
                `;

                // 下部：計算結果（2カラム）
                html += `<div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-700/50">`;
                
                // 左: 目標時間
                html += `
                    <div class="bg-slate-900/50 rounded p-2">
                        <div class="text-[9px] text-slate-400 mb-0.5">① 目標所要時間</div>
                        <div class="font-mono font-bold text-sm ${isSelf ? 'text-cyan-400' : 'text-emerald-400'}">
                            ${isSelf ? formatDigital(totalS) : formatDigital(targetTime)}
                        </div>
                        ${!isSelf ? `<div class="text-[9px] text-slate-500 mt-0.5">差: ${timeGap >= 0 ? '+' : ''}${Math.round(timeGap)}秒</div>` : '<div class="text-[9px] text-transparent mt-0.5">-</div>'}
                    </div>
                `;

                // 右: ギャップ
                const gapColor = gapToEven >= 0 ? 'text-amber-400' : 'text-rose-400';
                html += `
                    <div class="bg-slate-900/50 rounded p-2">
                        <div class="text-[9px] text-slate-400 mb-0.5">② イーブン差(ギャップ)</div>
                        <div class="font-mono text-xs text-slate-300">換算: ${formatDigital(convertedTime)}</div>
                        ${!isSelf ? `<div class="text-[10px] font-bold font-mono mt-0.5 ${gapColor}">差: ${gapToEven >= 0 ? '+' : ''}${Math.round(gapToEven)}秒</div>` : '<div class="text-[10px] text-slate-500 mt-0.5">自艇基準 (±0)</div>'}
                    </div>
                `;
                html += `</div>`;

                card.innerHTML = html;
                elResultList.appendChild(card);
            });
        }

        // 状態を画面全体に反映
        function renderAll() {
            elValH.textContent = state.h;
            elValM.textContent = state.m;
            elValS.textContent = state.s;

            const myBoat = FLEET.find(b => b.id === state.myBoatId);
            const totalS = (state.h * 3600) + (state.m * 60) + state.s;
            const myCorS = totalS * myBoat.tcf;

            elSummaryTcf.textContent = `TCF: ${myBoat.tcf.toFixed(3)}`;
            elSummaryCT.textContent = formatDigital(myCorS);

            renderList();
        }

        // アプリ起動
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
