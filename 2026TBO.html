<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>東京ベイオープン・シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        button { touch-action: manipulation; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-20">

    <header class="fixed top-0 left-0 right-0 bg-slate-800 border-b border-slate-700 z-50 px-4 py-3 shadow-md flex justify-between items-center">
        <h1 class="text-sm font-bold text-white">東京ベイオープン勝敗条件</h1>
        <button id="btn-share" class="bg-cyan-600 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg">結果コピー</button>
    </header>

    <main class="pt-16 px-3 max-w-lg mx-auto space-y-4">
        <section class="bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-lg">
            <select id="select-myboat" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm font-bold"></select>
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-700 mt-3">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-slate-400">自艇の実所要時間</span>
                    <button id="btn-reset-time" class="text-[10px] text-slate-500 bg-slate-800 px-2 py-1 rounded">3時間に戻す</button>
                </div>
                <div class="flex justify-between items-center gap-2 text-center">
                    <div class="flex-1 flex flex-col"><div class="flex bg-slate-800 rounded"><button id="btn-h-minus" class="w-8 h-10">-</button><div id="val-h" class="flex-1 flex items-center justify-center font-bold">3</div><button id="btn-h-plus" class="w-8 h-10">+</button></div></div>
                    <div class="flex-1 flex flex-col"><div class="flex bg-slate-800 rounded"><button id="btn-m-minus" class="w-8 h-10">-</button><div id="val-m" class="flex-1 flex items-center justify-center font-bold">0</div><button id="btn-m-plus" class="w-8 h-10">+</button></div></div>
                    <div class="flex-1 flex flex-col"><div class="flex bg-slate-800 rounded"><button id="btn-s-minus" class="w-8 h-10">-</button><div id="val-s" class="flex-1 flex items-center justify-center font-bold">0</div><button id="btn-s-plus" class="w-8 h-10">+</button></div></div>
                </div>
            </div>
        </section>

        <input type="text" id="input-search" placeholder="🔍 艇名検索..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm">
        <section id="result-list" class="space-y-3"></section>
    </main>

    <script>
        const FLEET = [
            { id: 1, name: "ANTONIA", tcf: 0.846 }, { id: 2, name: "Henrique Ⅸ", tcf: 0.841 }, { id: 3, name: "Blue Peter", tcf: 0.809 },
            { id: 4, name: "Laetitia Deux", tcf: 0.798 }, { id: 5, name: "SPIRIT OF URAYASU", tcf: 0.796 }, { id: 6, name: "SION", tcf: 0.794 },
            { id: 7, name: "FIRST LADY", tcf: 0.784 }, { id: 8, name: "Icarus", tcf: 0.781 }, { id: 26, name: "naonao", tcf: 0.735 },
            { id: 51, name: "AURA", tcf: 0.696 }
        ];

        let state = { myBoatId: 26, h: 3, m: 0, s: 0, search: '' };

        function init() {
            const elSelect = document.getElementById('select-myboat');
            FLEET.forEach(b => elSelect.add(new Option(`${b.name} (TCF:${b.tcf})`, b.id)));
            elSelect.value = state.myBoatId;

            ['h','m','s'].forEach(unit => {
                document.getElementById(`btn-${unit}-plus`).onclick = () => { if(unit==='h') state.h++; if(unit==='m') state.m++; if(unit==='s') state.s++; render(); };
                document.getElementById(`btn-${unit}-minus`).onclick = () => { if(unit==='h') state.h--; if(unit==='m') state.m--; if(unit==='s') state.s--; if(state.h<0)state.h=0; render(); };
            });

            document.getElementById('input-search').oninput = (e) => { state.search = e.target.value.toLowerCase(); render(); };
            render();
        }

        function render() {
            document.getElementById('val-h').textContent = state.h;
            document.getElementById('val-m').textContent = state.m;
            document.getElementById('val-s').textContent = state.s;
            
            const myB = FLEET.find(b => b.id === state.myBoatId);
            const totalS = (state.h * 3600) + (state.m * 60) + state.s;
            const myCorS = totalS * myB.tcf;

            const list = document.getElementById('result-list');
            list.innerHTML = '';

            FLEET.filter(b => b.name.toLowerCase().includes(state.search)).sort((a,b)=>b.tcf-a.tcf).forEach(b => {
                const diff = (myCorS / b.tcf) - totalS;
                const abs = Math.abs(Math.round(diff));
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-4 rounded-xl border border-slate-700";
                card.innerHTML = `
                    <div class="font-bold text-lg">${b.name} <span class="text-xs text-slate-500">TCF:${b.tcf}</span></div>
                    <div class="${diff < 0 ? 'text-emerald-400' : 'text-amber-400'} font-bold mt-2">
                        ${diff < 0 ? `⏱️ ${abs}秒以内の遅れなら勝ち` : `⏱️ ${abs}秒以上離せば勝ち`}
                    </div>
                `;
                list.appendChild(card);
            });
        }
        init();
    </script>
</body>
</html>
