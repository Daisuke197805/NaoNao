<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="utf-8">

<title>東京湾 海図ナビ</title>

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link

  rel="stylesheet"

  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

/>

<style>

html, body {

  margin: 0;

  padding: 0;

  height: 100%;

}

#map {

  width: 100%;

  height: 100%;

}

.info {

  position: absolute;

  top: 10px;

  left: 10px;

  z-index: 1000;

  background: rgba(255,255,255,0.9);

  padding: 10px 14px;

  border-radius: 10px;

  font-family: sans-serif;

  font-size: 14px;

  line-height: 1.5;

}

</style>

</head>

<body>

<div id="map"></div>

<div class="info">

  東京湾 海図ナビ<br>

  GPS + 航路 + ブイ

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================================

// 地図

// =====================================

const map = L.map('map', {

  zoomControl: true

}).setView([35.30, 139.80], 10);

// =====================================

// OpenStreetMap

// =====================================

L.tileLayer(

  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

  {

    attribution: '&copy; OpenStreetMap'

  }

).addTo(map);

// =====================================

// OpenSeaMap

// =====================================

L.tileLayer(

  'https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',

  {

    attribution: 'OpenSeaMap'

  }

).addTo(map);

// =====================================

// 東京湾主要航路

// =====================================

// 浦賀水道航路

const uragaRoute = [

  [35.22, 139.78],

  [35.15, 139.80],

  [35.08, 139.82]

];

// 中ノ瀬航路

const nakanoseRoute = [

  [35.33, 139.83],

  [35.28, 139.86],

  [35.22, 139.88]

];

// 航路描画

L.polyline(uragaRoute, {

  color: 'red',

  weight: 4,

  opacity: 0.8

})

.addTo(map)

.bindPopup("浦賀水道航路");

L.polyline(nakanoseRoute, {

  color: 'orange',

  weight: 4,

  opacity: 0.8

})

.addTo(map)

.bindPopup("中ノ瀬航路");

// =====================================

// 東京湾主要ブイ

// =====================================

const buoys = [

  {

    name: "中ノ瀬ブイ",

    lat: 35.30,

    lon: 139.86

  },

  {

    name: "浦賀水道航路第一号灯浮標",

    lat: 35.18,

    lon: 139.79

  },

  {

    name: "浦賀水道航路第三号灯浮標",

    lat: 35.12,

    lon: 139.81

  },

  {

    name: "第一海堡",

    lat: 35.31,

    lon: 139.76

  },

  {

    name: "第二海堡",

    lat: 35.29,

    lon: 139.79

  }

];

// ブイ表示

buoys.forEach(b => {

  const marker = L.circleMarker(

    [b.lat, b.lon],

    {

      radius: 8,

      color: "yellow",

      fillColor: "orange",

      fillOpacity: 0.9,

      weight: 2

    }

  ).addTo(map);

  marker.bindPopup(b.name);

});

// =====================================

// 自船GPS

// =====================================

let myMarker = null;

let myCircle = null;

navigator.geolocation.watchPosition(

  (pos) => {

    const lat = pos.coords.latitude;

    const lon = pos.coords.longitude;

    const acc = pos.coords.accuracy;

    if (!myMarker) {

      map.setView([lat, lon], 14);

      myMarker = L.marker([lat, lon])

        .addTo(map)

        .bindPopup("現在位置");

      myCircle = L.circle([lat, lon], {

        radius: acc,

        color: "blue",

        fillColor: "#30f",

        fillOpacity: 0.15

      }).addTo(map);

    } else {

      myMarker.setLatLng([lat, lon]);

      myCircle.setLatLng([lat, lon]);

      myCircle.setRadius(acc);

    }

  },

  (err) => {

    alert("GPS取得失敗: " + err.message);

  },

  {

    enableHighAccuracy: true,

    maximumAge: 0,

    timeout: 10000

  }

);

</script>

</body>

</html>
