<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="utf-8">

<title>東京湾 海図GPS</title>

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link

  rel="stylesheet"

  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

/>

<style>

html, body {

  margin: 0;

  padding: 0;

  height: 100%;

}

#map {

  width: 100%;

  height: 100%;

}

.info {

  position: absolute;

  top: 10px;

  left: 10px;

  z-index: 1000;

  background: rgba(255,255,255,0.9);

  padding: 10px 14px;

  border-radius: 10px;

  font-family: sans-serif;

  font-size: 14px;

}

</style>

</head>

<body>

<div id="map"></div>

<div class="info">

  東京湾 海図GPS

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ======================

// 地図作成

// ======================

const map = L.map('map', {

  zoomControl: true

}).setView([35.35, 139.75], 10);

// ======================

// OpenStreetMap

// ======================

L.tileLayer(

  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

  {

    attribution: '&copy; OpenStreetMap'

  }

).addTo(map);

// ======================

// OpenSeaMap 海図

// ======================

L.tileLayer(

  'https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',

  {

    attribution: 'OpenSeaMap'

  }

).addTo(map);

// ======================

// 東京湾主要航路（簡易版）

// ======================

// 浦賀水道航路

const uragaRoute = [

  [35.22, 139.78],

  [35.15, 139.80],

  [35.08, 139.82]

];

// 中ノ瀬航路

const nakanoseRoute = [

  [35.33, 139.83],

  [35.28, 139.86],

  [35.22, 139.88]

];

// 航路描画

L.polyline(uragaRoute, {

  color: 'red',

  weight: 4,

  opacity: 0.8

}).addTo(map).bindPopup("浦賀水道航路");

L.polyline(nakanoseRoute, {

  color: 'orange',

  weight: 4,

  opacity: 0.8

}).addTo(map).bindPopup("中ノ瀬航路");

// ======================

// 現在位置

// ======================

let myMarker = null;

let myCircle = null;

navigator.geolocation.watchPosition(

  (pos) => {

    const lat = pos.coords.latitude;

    const lon = pos.coords.longitude;

    const acc = pos.coords.accuracy;

    // 初回

    if (!myMarker) {

      map.setView([lat, lon], 14);

      myMarker = L.marker([lat, lon])

        .addTo(map)

        .bindPopup("現在位置");

      myCircle = L.circle([lat, lon], {

        radius: acc,

        color: 'blue',

        fillColor: '#30f',

        fillOpacity: 0.15

      }).addTo(map);

    } else {

      myMarker.setLatLng([lat, lon]);

      myCircle.setLatLng([lat, lon]);

      myCircle.setRadius(acc);

    }

  },

  (err) => {

    alert("位置情報取得失敗: " + err.message);

  },

  {

    enableHighAccuracy: true,

    maximumAge: 0,

    timeout: 10000

  }

);

</script>

</body>

</html>
