<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>東京湾 AIS NAVI</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html, body{
  margin:0;
  padding:0;
  height:100%;
}

#map{
  width:100%;
  height:100%;
}

.info{

  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;

  background:white;
  padding:10px;
  border-radius:10px;

  font-family:sans-serif;
  font-size:14px;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="info">
  東京湾 AIS NAVI
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ======================================
// 地図
// ======================================

const map = L.map("map")
  .setView([35.30,139.80], 10);


// ======================================
// OSM
// ======================================

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:"OSM"
  }
).addTo(map);


// ======================================
// OpenSeaMap
// ======================================

L.tileLayer(
  "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
  {
    attribution:"OpenSeaMap"
  }
).addTo(map);


// ======================================
// AIS管理
// ======================================

const ships = {};


// ======================================
// AIS取得
// ======================================

async function loadAIS(){

  try{

    const res = await fetch(
      "https://tokyobayais.daidai36.workers.dev/"
    );

    const list = await res.json();

    console.log(list);


    list.forEach(ship => {

      const mmsi = ship.mmsi;

      const lat = ship.lat;
      const lon = ship.lon;

      if(lat == null || lon == null)
        return;


      // ======================================
      // 初回生成
      // ======================================

      if(!ships[mmsi]){

        // 船マーカー
        const marker = L.circleMarker(
          [lat, lon],
          {
            radius:6,
            color:"lime",
            fillColor:"lime",
            fillOpacity:0.8
          }
        )
        .addTo(map)
        .bindPopup(
          "MMSI: " + mmsi
        );


        // 進行方向線
        const heading = L.polyline(
          [
            [lat, lon],
            [lat + 0.01, lon]
          ],
          {
            color:"lime",
            weight:2
          }
        ).addTo(map);


        ships[mmsi] = {
          marker,
          heading
        };

      }else{

        // 更新
        ships[mmsi].marker
          .setLatLng([lat, lon]);


        // 仮方向
        ships[mmsi].heading
          .setLatLngs([
            [lat, lon],
            [lat + 0.01, lon]
          ]);

      }

    });

  }catch(err){

    console.log(err);

  }

}


// ======================================
// AIS定期更新
// ======================================

loadAIS();

setInterval(loadAIS, 5000);


// ======================================
// 自船GPS
// ======================================

let myMarker = null;

navigator.geolocation.watchPosition(

  (pos) => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    if(!myMarker){

      myMarker = L.circleMarker(
        [lat, lon],
        {
          radius:8,
          color:"blue",
          fillColor:"cyan",
          fillOpacity:0.9
        }
      )
      .addTo(map)
      .bindPopup("現在位置");

      map.setView([lat, lon], 13);

    }else{

      myMarker.setLatLng([lat, lon]);

    }

  },

  (err) => {

    console.log(err);

  },

  {
    enableHighAccuracy:true
  }

);

</script>

</body>
</html>
