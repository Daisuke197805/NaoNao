<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>東京湾 AIS Map</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html, body {
  margin:0;
  padding:0;
  height:100%;
}

#map{
  width:100%;
  height:100%;
}

.info{
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;

  background:white;
  padding:10px;
  border-radius:10px;

  font-family:sans-serif;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="info">
  東京湾 AIS
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ======================================
// 地図
// ======================================

const map = L.map("map")
  .setView([35.30,139.80], 10);


// ======================================
// OSM
// ======================================

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:"OSM"
  }
).addTo(map);


// ======================================
// OpenSeaMap
// ======================================

L.tileLayer(
  "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png",
  {
    attribution:"OpenSeaMap"
  }
).addTo(map);


// ======================================
// AIS取得
// ======================================

async function loadAIS(){

  try{

    const res = await fetch(
      "https://tokyobayais.daidai36.workers.dev/"
    );

    const data = await res.json();

    console.log(data);


    // ======================================
    // MetaData利用
    // ======================================

    if(!data.MetaData)
      return;

    const lat = data.MetaData.latitude;
    const lon = data.MetaData.longitude;

    const mmsi = data.MetaData.MMSI;


    L.circleMarker(
      [lat, lon],
      {
        radius:6,
        color:"lime",
        fillColor:"lime",
        fillOpacity:0.8
      }
    )
    .addTo(map)
    .bindPopup(
      "MMSI: " + mmsi
    );


  }catch(err){

    console.log(err);

  }

}


// 初回読み込み
loadAIS();

</script>

</body>
</html>
