<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Worker Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
  font-family:sans-serif;
  padding:20px;
}

#result{
  margin-top:20px;
  white-space:pre-wrap;
  background:#eee;
  padding:10px;
  border-radius:10px;
}

</style>
</head>

<body>

<h2>Cloudflare Worker 接続テスト</h2>

<button onclick="loadData()">
  Workerへ接続
</button>

<div id="result">
待機中
</div>

<script>

async function loadData(){

  const result =
    document.getElementById("result");

  result.textContent = "通信中...";

  try{

    const res = await fetch(
      "https://tokyobayais.daidai36.workers.dev/"
    );

    const data = await res.json();

    result.textContent =
      JSON.stringify(data, null, 2);

  }catch(err){

    result.textContent =
      "ERROR: " + err.message;

  }

}

</script>

</body>
</html>
