<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="utf-8">

<title>東京湾 AIS 海図ナビ</title>

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link

  rel="stylesheet"

  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

/>

<style>

html, body {

  margin: 0;

  padding: 0;

  height: 100%;

}

#map {

  width: 100%;

  height: 100%;

}

.info {

  position: absolute;

  top: 10px;

  left: 10px;

  z-index: 1000;

  background: rgba(255,255,255,0.9);

  padding: 10px 14px;

  border-radius: 10px;

  font-family: sans-serif;

  font-size: 14px;

  line-height: 1.5;

}

</style>

</head>

<body>

<div id="map"></div>

<div class="info">

  東京湾 AIS 海図ナビ

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ======================================

// AISStream API KEY

// ======================================

const API_KEY = "02bfdf3e9685ae762daf1b00a97b9ef6d52ad98a";

// ======================================

// 地図作成

// ======================================

const map = L.map('map', {

  zoomControl: true

}).setView([35.30, 139.80], 10);

// ======================================

// OpenStreetMap

// ======================================

L.tileLayer(

  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',

  {

    attribution: '&copy; OpenStreetMap'

  }

).addTo(map);

// ======================================

// OpenSeaMap 海図

// ======================================

L.tileLayer(

  'https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',

  {

    attribution: 'OpenSeaMap'

  }

).addTo(map);

// ======================================

// 東京湾主要航路

// ======================================

// 浦賀水道航路

const uragaRoute = [

  [35.22, 139.78],

  [35.15, 139.80],

  [35.08, 139.82]

];

// 中ノ瀬航路

const nakanoseRoute = [

  [35.33, 139.83],

  [35.28, 139.86],

  [35.22, 139.88]

];

// 航路描画

L.polyline(uragaRoute, {

  color: 'red',

  weight: 4,

  opacity: 0.8

})

.addTo(map)

.bindPopup("浦賀水道航路");

L.polyline(nakanoseRoute, {

  color: 'orange',

  weight: 4,

  opacity: 0.8

})

.addTo(map)

.bindPopup("中ノ瀬航路");

// ======================================

// 東京湾主要ブイ

// ======================================

const buoys = [

  {

    name: "中ノ瀬ブイ",

    lat: 35.30,

    lon: 139.86

  },

  {

    name: "浦賀水道航路第一号灯浮標",

    lat: 35.18,

    lon: 139.79

  },

  {

    name: "浦賀水道航路第三号灯浮標",

    lat: 35.12,

    lon: 139.81

  },

  {

    name: "第一海堡",

    lat: 35.31,

    lon: 139.76

  },

  {

    name: "第二海堡",

    lat: 35.29,

    lon: 139.79

  }

];

// ブイ描画

buoys.forEach(b => {

  L.circleMarker(

    [b.lat, b.lon],

    {

      radius: 8,

      color: "yellow",

      fillColor: "orange",

      fillOpacity: 0.9,

      weight: 2

    }

  )

  .addTo(map)

  .bindPopup(b.name);

});

// ======================================

// 自船GPS

// ======================================

let myMarker = null;

let myCircle = null;

navigator.geolocation.watchPosition(

  (pos) => {

    const lat = pos.coords.latitude;

    const lon = pos.coords.longitude;

    const acc = pos.coords.accuracy;

    if (!myMarker) {

      map.setView([lat, lon], 14);

      myMarker = L.marker([lat, lon])

        .addTo(map)

        .bindPopup("現在位置");

      myCircle = L.circle([lat, lon], {

        radius: acc,

        color: "blue",

        fillColor: "#30f",

        fillOpacity: 0.15

      }).addTo(map);

    } else {

      myMarker.setLatLng([lat, lon]);

      myCircle.setLatLng([lat, lon]);

      myCircle.setRadius(acc);

    }

  },

  (err) => {

    alert("GPS取得失敗: " + err.message);

  },

  {

    enableHighAccuracy: true,

    maximumAge: 0,

    timeout: 10000

  }

);

// ======================================

// AIS

// ======================================

const ships = {};

const socket = new WebSocket(

  "wss://stream.aisstream.io/v0/stream"

);

// 接続

socket.addEventListener("open", () => {

  console.log("AIS connected");

  socket.send(JSON.stringify({

    APIKey: API_KEY,

    BoundingBoxes: [

      [

        [35.0, 139.6],

        [35.8, 140.1]

      ]

    ]

  }));

});

// データ受信

socket.addEventListener("message", (event) => {

  try {

    const data = JSON.parse(event.data);

    // PositionReportのみ処理

    if (!data.Message.PositionReport)

      return;

    const report = data.Message.PositionReport;

    const lat = report.Latitude;

    const lon = report.Longitude;

    const mmsi = report.UserID;

    // 異常値除外

    if (!lat || !lon)

      return;

    // 初回

    if (!ships[mmsi]) {

      ships[mmsi] = L.circleMarker(

        [lat, lon],

        {

          radius: 5,

          color: "lime",

          fillColor: "lime",

          fillOpacity: 0.8,

          weight: 1

        }

      )

      .addTo(map)

      .bindPopup(

        "MMSI: " + mmsi

      );

    } else {

      // 更新

      ships[mmsi].setLatLng([lat, lon]);

    }

  } catch(err) {

    console.log(err);

  }

});

// エラー

socket.addEventListener("error", (err) => {

  console.log("AIS error", err);

});

// 切断

socket.addEventListener("close", () => {

  console.log("AIS disconnected");

});

</script>

</body>

</html>
