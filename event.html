
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>レース&イベント</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280;
      --brand:#1976d2; --brand2:#155fa8; --danger:#c62828; --danger2:#b71c1c;
      --accent:#f57c00; --accent2:#ef6c00;
      --shadow:0 2px 14px rgba(0,0,0,.08); --radius:14px;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; padding:0; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background:var(--bg); color:var(--text); }

    /* ===== ハンバーガー ===== */
    .hamburger{
      width:28px;
      height:22px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      cursor:pointer;
    }
    .hamburger span{
      height:3px;
      background:#fff;
      border-radius:2px;
      display:block;
    }

    /* ===== メニュー ===== */
    #menu{
      position:fixed;
      top:0;
      left:-260px;
      width:240px;
      height:100%;
      background:#fff;
      box-shadow:2px 0 10px rgba(0,0,0,.15);
      padding:60px 16px;
      transition:left .25s;
      z-index:20;
    }
    #menu a{
      display:block;
      padding:12px;
      margin-bottom:8px;
      text-decoration:none;
      color:#111;
      font-weight:700;
      border-radius:8px;
    }
    #menu a:hover{
      background:#fff3e0;
    }
    #menu a.active{
      color:#aaa;
      pointer-events:none;
    }
    #menu.open{
      left:0;
    }

    /* 背景オーバーレイ */
    .menuOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.3);
      display:none;
      z-index:15;
    }
    .menuOverlay.show{
      display:block;
    }

    /* ===== ヘッダー ===== */
    header{
      position:sticky;
      top:0;
      z-index:10;
      background:linear-gradient(90deg, #fb8c00, #ffa726);
      color:#fff;
      padding:12px 16px;
      box-shadow:0 2px 10px rgba(0,0,0,.12);
    }
    header .row{
      display:flex;
      align-items:center;
      gap:12px;
      max-width:980px;
      margin:0 auto;
    }
    header .title{
      font-weight:800;
      letter-spacing:.02em;
    }

    /* ===== メイン ===== */
    main{
      max-width:980px;
      margin:0 auto;
      padding:12px;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; margin:12px 0; }
    .btn{ font-size:15px; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:#fff; cursor:pointer; }
    .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
    .btn.primary:hover{ background:var(--accent2); border-color:var(--accent2); }
    .btn.secondary{ background:#78909c; border-color:#78909c; color:#fff; font-weight:700; }
    .btn.secondary:hover{ background:#607d8b; border-color:#607d8b; }
    .btn:active{ transform:translateY(1px); }

    input{ font-size:15px; padding:10px 10px; border-radius:12px; border:1px solid var(--border); background:#fff; }
    input:focus{ outline:none; border-color:#ffcc80; box-shadow:0 0 0 4px rgba(255,167,38,.25); }

    .pill{ display:inline-block; padding:3px 10px; border-radius:999px; background:#eef3ff; border:1px solid #dbe7ff; color:#1a3e8a; font-size:12px; }
    .muted{ color:var(--muted); font-size:13px; }
    .title{ font-weight:800; }
    .sep{ height:1px; background:var(--border); margin:10px 0; }

    /* ===== ツールバー ===== */
    .toolbar{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }
    .toolbar label{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:13px;
      color:var(--muted);
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
    }
    .toolbar input[type="checkbox"]{
      width:18px;
      height:18px;
      accent-color:var(--accent);
      cursor:pointer;
    }

    /* ===== 日付 ===== */
    .event-date{ font-size:17px; font-weight:700; color:var(--text); }

    /* ===== 参加フォーム ===== */
    .join-row{ display:flex; gap:8px; align-items:center; flex-wrap:nowrap; }
    .join-row input{ flex:1 1 160px; min-width:0; }
    .join-row .btn{ flex:0 0 auto; white-space:nowrap; }
    .note-row{ margin-top:8px; }
    .note-row input{ width:100%; }

    /* ===== 参加者ピル ===== */
    .participants{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
    .participants .name{
      background:#f3f4f6; border:1px solid #e5e7eb; padding:4px 10px;
      border-radius:999px; font-size:12px; cursor:pointer;
      user-select:none; -webkit-user-select:none; transition:background .15s;
    }
    .participants .name.has-note{ border-bottom:2px solid var(--accent); }
    .participants .name:active{ background:#e5e7eb; }

    /* ===== 不参加者ピル ===== */
    .participants .name.declined{
      background:#fef2f2;
      border:1px solid #fca5a5;
      color:#991b1b;
    }
    .participants .name.declined.has-note{
      border-bottom:2px solid #f87171;
    }
    .participants .name.declined:active{ background:#fee2e2; }

    /* ===== ポップアップ ===== */
    .popup-overlay{
      display:none; position:fixed; inset:0; z-index:100;
      background:rgba(0,0,0,.35); justify-content:center; align-items:center; padding:24px;
    }
    .popup-overlay.active{ display:flex; }
    .popup-box{
      background:#fff; border-radius:16px; box-shadow:0 8px 40px rgba(0,0,0,.18);
      padding:20px; max-width:340px; width:100%; text-align:left; animation:popIn .15s ease-out;
    }
    @keyframes popIn{ from{transform:scale(.92);opacity:0} to{transform:scale(1);opacity:1} }
    .popup-box .popup-name{ font-weight:800; font-size:16px; margin-bottom:8px; }
    .popup-box .popup-note{ font-size:14px; color:var(--text); line-height:1.6; white-space:pre-wrap; word-break:break-word; }
    .popup-box .popup-close{
      display:block; margin-top:14px; text-align:center; font-size:14px;
      color:var(--accent); font-weight:700; cursor:pointer; padding:8px;
      border-radius:10px; border:1px solid var(--accent); background:#fff;
    }
    .popup-box .popup-close:active{ background:#fff3e0; }

    /* ===== ローディング ===== */
    .loading-overlay{
      display:none;
      position:fixed;
      inset:0;
      z-index:200;
      background:rgba(255,255,255,.7);
      justify-content:center;
      align-items:center;
      flex-direction:column;
      gap:12px;
    }
    .loading-overlay.active{ display:flex; }
    .spinner{
      width:36px; height:36px;
      border:4px solid var(--border);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .loading-overlay .loading-text{
      font-size:14px;
      color:var(--muted);
      font-weight:700;
    }

    pre{ white-space:pre-wrap; word-break:break-word; margin:0; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size:12px; }
    details summary{ cursor:pointer; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>

<!-- ===== ハンバーガーメニュー ===== -->
<div id="menu">
  <a href="index.html">トップ</a>
  <a href="event.html">レース&amp;イベント</a>
  <a href="StartIn.html">スタートライン</a>
   <a href="Timer.html">スタートタイマー</a>
  <a href="RateCompare.html">レーティング比較</a>
   <a href="M3.html">航跡表示</a>
  
  <a href="AISviewer.html">AIS（テスト）</a>
  <a href="M2.html">マニュアル</a>
</div>
<div class="menuOverlay" id="menuOverlay" onclick="closeMenu()"></div>

  <!-- ===== ヘッダー ===== -->
  <header>
    <div class="row">
      <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="title">レース＆イベント</div>
    </div>
  </header>

  <main>
    <!-- ===== ツールバー ===== -->
    <div class="toolbar">
      <button class="btn primary" onclick="reloadAll()">更新</button>
      <label>
        <input type="checkbox" id="hidePast" checked onchange="applyFilter()">
        過去のイベントを非表示
      </label>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="title">状態</div>
        <span class="pill" id="statusPill">待機中</span>
      </div>
      <div class="sep"></div>
      <div class="muted" id="statusText">ページ読込完了：更新ボタンを押してください</div>

      <details style="margin-top:10px;">
        <summary>デバッグログ（必要なときだけ開く）</summary>
        <div class="sep"></div>
        <pre id="debug">(ログ)</pre>
      </details>
    </div>

    <div id="list"></div>
  </main>

  <!-- ===== ポップアップ ===== -->
  <div class="popup-overlay" id="popupOverlay" onclick="closePopup()">
    <div class="popup-box" onclick="event.stopPropagation()">
      <div class="popup-name" id="popupName"></div>
      <div class="popup-note" id="popupNote"></div>
      <div class="popup-close" onclick="closePopup()">閉じる</div>
    </div>
  </div>

  <!-- ===== ローディング ===== -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">データ更新中…</div>
  </div>

  <script>
    // ===== メニュー制御 =====
    function toggleMenu(){
      document.getElementById("menu").classList.toggle("open");
      document.getElementById("menuOverlay").classList.toggle("show");
    }
    function closeMenu(){
      document.getElementById("menu").classList.remove("open");
      document.getElementById("menuOverlay").classList.remove("show");
    }

    // 現在ページ無効化
    (function(){
      const menuLinks = document.querySelectorAll("#menu a");
      const currentPage = location.pathname.split("/").pop() || "index.html";
      menuLinks.forEach(link=>{
        if(link.getAttribute("href")===currentPage){
          link.classList.add("active");
          link.removeAttribute("href");
        }
      });
    })();

    // =========================
    // 固定：GAS WebアプリURL
    // =========================
    const API_URL = "https://script.google.com/macros/s/AKfycbzaLPhysJ3_e18Hk25-dumu7324yqDwE7KWgqegPYd9j-6d5eiZsoP5Tze2KcnKkKOcEw/exec";

    const list = document.getElementById("list");
    const statusPill = document.getElementById("statusPill");
    const statusText = document.getElementById("statusText");
    const debug = document.getElementById("debug");
    const loadingOverlay = document.getElementById("loadingOverlay");

    let cachedEvents = [];
    let cachedParticipants = [];

    function setStatus(label, text){
      statusPill.textContent = label;
      statusText.textContent = text;
    }
    function logDebug(msg){
      const t = new Date().toISOString();
      debug.textContent = `${t}  ${msg}\n` + debug.textContent;
    }

    // =========================
    // ローディング制御
    // =========================
    function showLoading(){ loadingOverlay.classList.add("active"); }
    function hideLoading(){ loadingOverlay.classList.remove("active"); }

    // =========================
    // 6桁 event_id 正規化
    // =========================
    function pad6(value){
      const s = String(value ?? "").trim();
      if (/^\d+$/.test(s)) return s.padStart(6, "0");
      return s;
    }

    // =========================
    // 表示整形
    // =========================
    const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

    function formatDateJST(value){
      if (!value) return "";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const w = WEEKDAYS[d.getDay()];
      return `${y}/${m}/${day}（${w}）`;
    }
    function formatTimeHHMM(value){
      if (!value) return "";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    function toDateOnlyMs(value){
      if (!value) return 0;
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return 0;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    }
    function todayMs(){
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    }

    function escapeHtml(str){
      return String(str ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[c]));
    }

    // =========================
    // ポップアップ
    // =========================
    const popupOverlay = document.getElementById("popupOverlay");
    const popupName = document.getElementById("popupName");
    const popupNote = document.getElementById("popupNote");

    function showPopup(name, note){
      popupName.textContent = name;
      popupNote.textContent = note || "（備考なし）";
      popupOverlay.classList.add("active");
    }
    function closePopup(){
      popupOverlay.classList.remove("active");
    }
    window.showPopup = showPopup;
    window.closePopup = closePopup;

    // =========================
    // CORS回避：フォームPOST
    // =========================
    async function postForm(paramsObj){
      const body = new URLSearchParams(paramsObj);
      logDebug("POST " + JSON.stringify(paramsObj));

      const res = await fetch(API_URL, { method:"POST", body });

      if (!res.ok){
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 200)}`);
      }

      const text = await res.text();

      let json;
      try{
        json = JSON.parse(text);
      }catch{
        throw new Error("JSON解析失敗（先頭200文字）: " + text.slice(0, 200));
      }
      return json;
    }

    // =========================
    // API呼び出し（★ getAll に統合）
    // =========================
    async function apiGetAll(){
      return await postForm({ type: "getAll" });
    }
    async function apiJoinEvent(eventId, name, note){
      return await postForm({
        type: "joinEvent",
        event_id: pad6(eventId),
        participant_name: name,
        participant_note: note || ""
      });
    }
    async function apiDeclineEvent(eventId, name, note){
      return await postForm({
        type: "declineEvent",
        event_id: pad6(eventId),
        participant_name: name,
        participant_note: note || ""
      });
    }

    // =========================
    // 共通：レスポンスからキャッシュ更新＋描画
    // =========================
    function applyData(res){
      const events = (res.events || []).map(e => ({ ...e, event_id: pad6(e.event_id) }));
      const participants = (res.participants || []).map(p => ({ ...p, event_id: pad6(p.event_id) }));

      // 日付が近い順（昇順）でソート
      events.sort((a, b) => {
        const da = new Date(a.event_date);
        const db = new Date(b.event_date);
        return da - db;
      });

      cachedEvents = events;
      cachedParticipants = participants;

      setStatus("OK", `イベント ${events.length} 件`);
      render(events, participants);
    }

    // =========================
    // 画面構築
    // =========================
    function render(events, participants){
      const byEvent = new Map();
      for (const p of participants){
        const eid = pad6(p.event_id);
        if (!byEvent.has(eid)) byEvent.set(eid, []);
        byEvent.get(eid).push(p);
      }

      // 過去イベント非表示フィルタ
      const hidePast = document.getElementById("hidePast").checked;
      const today = todayMs();

      let filtered = events;
      if (hidePast){
        filtered = events.filter(ev => toDateOnlyMs(ev.event_date) >= today);
      }

      list.innerHTML = "";
      if (!filtered.length){
        const msg = hidePast
          ? "表示するイベントがありません（過去のイベントは非表示中）"
          : "イベントが0件です（tbl_event を確認してください）";
        list.innerHTML = `<div class="card">${msg}</div>`;
        return;
      }

      for (const ev of filtered){
        const eid = pad6(ev.event_id);
        const dateStr = formatDateJST(ev.event_date);
        const timeStr = formatTimeHHMM(ev.event_start);
        const allMem = byEvent.get(eid) || [];

        // 参加者と不参加者を分離
        const activeMem = allMem.filter(p => p.status === "active");
        const declinedMem = allMem.filter(p => p.status === "declined");

        const card = document.createElement("div");
        card.className = "card";

        // 参加者ピル生成
        function buildPills(members, isDeclined){
          return members.map(p => {
            const name = escapeHtml(p.participant_name ?? "");
            const hasNote = (p.participant_note ?? "").trim() !== "";
            let cls = isDeclined ? "name declined" : "name";
            if (hasNote) cls += " has-note";
            const nameForJs = (p.participant_name ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
            const noteForJs = (p.participant_note ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
            return `<span class="${cls}" onclick="showPopup('${nameForJs}','${noteForJs}')">${name}</span>`;
          }).join("");
        }

        const activePillsHtml = buildPills(activeMem, false);
        const declinedPillsHtml = buildPills(declinedMem, true);

        // 不参加ブロック（0名なら非表示）
        const declinedBlock = declinedMem.length > 0
          ? `<div class="muted" style="margin-top:10px;">不参加：${declinedMem.length} 名</div>
             <div class="participants">${declinedPillsHtml}</div>`
          : "";

        card.innerHTML = `
          <div class="row" style="justify-content:space-between;">
            <div>
              <span class="title">${escapeHtml(ev.event_name ?? "")}</span>
            </div>
          </div>

          <div class="event-date" style="margin-top:6px;">
            ${escapeHtml(dateStr)} ${escapeHtml(timeStr)}
          </div>

          <div class="muted" style="margin-top:6px;">
            メモ：${escapeHtml(ev.event_memo ?? "")}
          </div>

          <div class="sep"></div>

          <div class="join-row">
            <input id="name_${eid}" placeholder="名前">
            <button class="btn primary" onclick="handleJoin('${eid}')">参加</button>
            <button class="btn secondary" onclick="handleDecline('${eid}')">不参加</button>
          </div>

          <div class="note-row">
            <input id="note_${eid}" placeholder="備考（任意）">
          </div>

          <div class="muted" style="margin-top:10px;">参加者：${activeMem.length} 名</div>
          <div class="participants">
            ${activePillsHtml}
          </div>

          ${declinedBlock}
        `;

        list.appendChild(card);
      }
    }

    // =========================
    // フィルタ切替
    // =========================
    function applyFilter(){
      render(cachedEvents, cachedParticipants);
    }
    window.applyFilter = applyFilter;

    // =========================
    // メイン：再取得（★ 1回のAPIで完了）
    // =========================
    async function reloadAll(){
      try{
        showLoading();
        setStatus("取得中", "イベント・参加者を取得しています...");
        logDebug("reloadAll start");

        const res = await apiGetAll();

        if (res.status !== "ok") throw new Error("getAll失敗: " + (res.message || ""));

        applyData(res);
        logDebug("reloadAll ok");
      }catch(err){
        setStatus("エラー", "取得に失敗しました。デバッグログを確認してください。");
        logDebug("ERROR: " + (err?.message || String(err)));
        alert("取得に失敗しました：" + (err?.message || String(err)));
      }finally{
        hideLoading();
      }
    }

    // =========================
    // 参加処理（★ レスポンスに最新データ同梱→再取得不要）
    // =========================
    async function handleJoin(eventId){
      try{
        showLoading();
        const eid = pad6(eventId);
        const nameEl = document.getElementById("name_" + eid);
        const noteEl = document.getElementById("note_" + eid);

        const name = (nameEl.value || "").trim();
        const note = (noteEl.value || "").trim();

        if (!name){
          hideLoading();
          alert("名前を入力してください");
          return;
        }

        setStatus("送信中", `参加登録を送信しています... event_id=${eid}`);
        logDebug(`joinEvent start event_id=${eid} name=${name}`);

        const res = await apiJoinEvent(eid, name, note);

        if (res.status === "ok"){
          alert("参加登録しました！");
          nameEl.value = "";
          noteEl.value = "";
          applyData(res);
          logDebug("joinEvent ok (new)");
          return;
        }

        if (res.status === "updated"){
          alert("参加に変更しました！");
          nameEl.value = "";
          noteEl.value = "";
          applyData(res);
          logDebug("joinEvent ok (updated)");
          return;
        }

        if (res.status === "exists"){
          alert("すでに参加登録されています。");
          return;
        }

        throw new Error(res.message || "参加登録に失敗しました");
      }catch(err){
        setStatus("エラー", "参加登録に失敗しました。デバッグログを確認してください。");
        logDebug("joinEvent ERROR: " + (err?.message || String(err)));
        alert("参加登録に失敗しました：" + (err?.message || String(err)));
      }finally{
        hideLoading();
      }
    }

    // =========================
    // 不参加処理（★ レスポンスに最新データ同梱→再取得不要）
    // =========================
    async function handleDecline(eventId){
      try{
        showLoading();
        const eid = pad6(eventId);
        const nameEl = document.getElementById("name_" + eid);
        const noteEl = document.getElementById("note_" + eid);

        const name = (nameEl.value || "").trim();
        const note = (noteEl.value || "").trim();

        if (!name){
          hideLoading();
          alert("名前を入力してください");
          return;
        }

        setStatus("送信中", `不参加登録を送信しています... event_id=${eid}`);
        logDebug(`declineEvent start event_id=${eid} name=${name}`);

        const res = await apiDeclineEvent(eid, name, note);

        if (res.status === "ok"){
          alert("不参加を登録しました。");
          nameEl.value = "";
          noteEl.value = "";
          applyData(res);
          logDebug("declineEvent ok (new)");
          return;
        }

        if (res.status === "updated"){
          alert("不参加に変更しました。");
          nameEl.value = "";
          noteEl.value = "";
          applyData(res);
          logDebug("declineEvent ok (updated)");
          return;
        }

        if (res.status === "exists"){
          alert("すでに不参加として登録されています。");
          return;
        }

        throw new Error(res.message || "不参加登録に失敗しました");
      }catch(err){
        setStatus("エラー", "不参加登録に失敗しました。デバッグログを確認してください。");
        logDebug("declineEvent ERROR: " + (err?.message || String(err)));
        alert("不参加登録に失敗しました：" + (err?.message || String(err)));
      }finally{
        hideLoading();
      }
    }

    // グローバル公開（onclick用）
    window.reloadAll = reloadAll;
    window.handleJoin = handleJoin;
    window.handleDecline = handleDecline;

    // 初期：自動で一度読み込み
    setStatus("待機中", "自動取得を開始します...");
    reloadAll();
  </script>
</body>
</html>
