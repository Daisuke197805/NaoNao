<!doctype html>

<html lang="ja">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>レース&イベント</title>

  <style>

    :root{

      --bg:#f6f7fb; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280;

      --brand:#1976d2; --brand2:#155fa8; --danger:#c62828; --danger2:#b71c1c;

      --accent:#f57c00; --accent2:#ef6c00;

      --shadow:0 2px 14px rgba(0,0,0,.08); --radius:14px;

    }

    *{ box-sizing:border-box; }

    body{

      margin:0;

      padding:0;

      font-family:system-ui, -apple-system, "Segoe UI", sans-serif;

      background:var(--bg);

      color:var(--text);

    }

    /* ===== 追加：ハンバーガー ===== */

    #menuBtn{

      position:fixed;

      top:max(12px, env(safe-area-inset-top));

      right:12px;

      z-index:2000;

      font-size:22px;

      background:rgba(255,255,255,.85);

      border:none;

      border-radius:10px;

      padding:6px 10px;

      box-shadow:0 2px 8px rgba(0,0,0,.2);

    }

    #menu{

      position:fixed;

      top:0;

      right:-260px;

      width:260px;

      height:100%;

      background:#333;

      padding-top:60px;

      transition:.3s;

      z-index:1500;

    }

    #menu.open{ right:0; }

    #menu a{

      display:block;

      color:#fff;

      padding:15px;

      text-decoration:none;

    }

    #menu a.active{

      color:#aaa;

      pointer-events:none;

    }

    #overlayMenu{

      position:fixed;

      inset:0;

      background:rgba(0,0,0,.4);

      opacity:0;

      visibility:hidden;

      transition:.3s;

      z-index:1400;

    }

    #overlayMenu.show{

      opacity:1;

      visibility:visible;

    }

    /* ===== ヘッダー ===== */

    header{

      position:sticky;

      top:0;

      z-index:10;

      background:linear-gradient(90deg, #fb8c00, #ffa726);

      color:#fff;

      padding:12px 16px;

      box-shadow:0 2px 10px rgba(0,0,0,.12);

    }

    header .row{

      display:flex;

      align-items:center;

      gap:12px;

      max-width:980px;

      margin:0 auto;

    }

    header .title{

      font-weight:800;

      letter-spacing:.02em;

    }

    /* ===== メイン（ここから元のまま）===== */

    main{

      max-width:980px;

      margin:0 auto;

      padding:12px;

    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; margin:12px 0; }

    .btn{ font-size:15px; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:#fff; cursor:pointer; }

    .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }

    .btn.primary:hover{ background:var(--accent2); border-color:var(--accent2); }

    .btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; font-weight:700; }

    .btn.danger:hover{ background:var(--danger2); border-color:var(--danger2); }

    .btn:active{ transform:translateY(1px); }

    input{ font-size:15px; padding:10px 10px; border-radius:12px; border:1px solid var(--border); background:#fff; }

    input:focus{ outline:none; border-color:#ffcc80; box-shadow:0 0 0 4px rgba(255,167,38,.25); }

    .pill{ display:inline-block; padding:3px 10px; border-radius:999px; background:#eef3ff; border:1px solid #dbe7ff; color:#1a3e8a; font-size:12px; }

    .muted{ color:var(--muted); font-size:13px; }

    .title{ font-weight:800; }

    .sep{ height:1px; background:var(--border); margin:10px 0; }

    .toolbar{

      display:flex;

      gap:12px;

      align-items:center;

      flex-wrap:wrap;

    }

    .toolbar label{

      display:flex;

      align-items:center;

      gap:6px;

      font-size:13px;

      color:var(--muted);

      cursor:pointer;

    }

    .toolbar input[type="checkbox"]{

      width:18px;

      height:18px;

      accent-color:var(--accent);

    }

  </style>

</head>

<body>

<!-- ハンバーガー -->

<button id="menuBtn">☰</button>

<div id="overlayMenu"></div>

<nav id="menu">

  <a href="index.html">トップ</a>

  <a href="event.html">レース&イベント</a>

  <a href="StartIn.html">スタートライン</a>

  <a href="RateCompare.html">レーティング比較</a>

  <a href="AISviewer.html">AIS</a>

</nav>

<!-- ===== ヘッダー（ボタン削除済み）===== -->

<header>

  <div class="row">

    <div class="title">レース＆イベント</div>

  </div>

</header>

<main>

  <!-- ここから下は完全に元のまま -->

  <div class="toolbar">

    <button class="btn primary" onclick="reloadAll()">更新</button>

    <label>

      <input type="checkbox" id="hidePast" checked onchange="applyFilter()">

      過去のイベントを非表示

    </label>

  </div>

  <div class="card">

    <div class="row" style="justify-content:space-between;">

      <div class="title">状態</div>

      <span class="pill" id="statusPill">待機中</span>

    </div>

    <div class="sep"></div>

    <div class="muted" id="statusText">ページ読込完了：更新ボタンを押してください</div>

  </div>

  <div id="list"></div>

</main>

<script>

// ===== メニュー制御（追加のみ）=====

const menuBtn = document.getElementById("menuBtn");

const menu = document.getElementById("menu");

const overlayMenu = document.getElementById("overlayMenu");

menuBtn.onclick = () => {

  menu.classList.toggle("open");

  overlayMenu.classList.toggle("show");

};

overlayMenu.onclick = () => {

  menu.classList.remove("open");

  overlayMenu.classList.remove("show");

};

// 現在ページ無効化

const links = document.querySelectorAll("#menu a");

const current = location.pathname.split("/").pop() || "index.html";

links.forEach(link=>{

  if(link.getAttribute("href")===current){

    link.classList.add("active");

    link.removeAttribute("href");

  }

});

// ===== 既存JSはこの下にそのまま =====

</script>

</body>

</html>
