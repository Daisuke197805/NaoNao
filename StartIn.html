
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>距離測定アプリ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
}
#map {
  position: fixed;
  top: 0;
  bottom: 0;
  width: 100%;
}

/* ===== ハンバーガーボタン（左上フロート）===== */
.hamburger-btn{
  position:fixed;
  top:max(10px, env(safe-area-inset-top));
  left:10px;
  z-index:2000;
  width:40px;
  height:36px;
  background:rgba(255,255,255,0.9);
  border:none;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  padding:0;
}
.hamburger-btn span{
  display:block;
  width:22px;
  height:3px;
  background:#333;
  border-radius:2px;
}

/* ===== メニュー ===== */
#menu{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:#fff;
  box-shadow:2px 0 10px rgba(0,0,0,.15);
  padding:60px 16px;
  transition:left .25s;
  z-index:20;
}
#menu a{
  display:block;
  padding:12px;
  margin-bottom:8px;
  text-decoration:none;
  color:#111;
  font-weight:700;
  border-radius:8px;
}
#menu a:hover{
  background:#f3f4f6;
}
#menu a.active{
  color:#aaa;
  pointer-events:none;
}
#menu.open{
  left:0;
}

/* 背景オーバーレイ */
.menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  display:none;
  z-index:15;
}
.menuOverlay.show{
  display:block;
}

/* 上部距離表示 */
#topbar {
  position: fixed;
  top: 10px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  z-index: 1000;
}
#distance {
  background: rgba(255,255,255,0.9);
  padding: 8px 40px;
  font-size: 18px;
  border-radius: 10px;
}

/* 右上ボタン */
#topRight {
  position: fixed;
  top: 60px;
  right: 10px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.topBtn {
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 8px 10px;
  border-radius: 8px;
  border: none;
  text-decoration: none;
  text-align: center;
  font-size: 14px;
}

/* 下部ボタン */
.controls {
  position: fixed;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: space-around;
  z-index: 1000;
}
.controls button {
  font-size: 18px;
  padding: 15px;
  border-radius: 12px;
  border: none;
  color: white;
  width: 28%;
}
.btnA { background: #34C759; }
.btnB { background: #007AFF; }
.btnC { background: #FF3B30; }
</style>
</head>
<body>

<!-- ===== ハンバーガーメニュー ===== -->
<div id="menu">
  <a href="index.html">トップ</a>
  <a href="event.html">レース&amp;イベント</a>
  <a href="StartIn.html">スタートライン</a>
   <a href="Timer.html">スタートタイマー</a>
  <a href="RateCompare.html">レーティング比較</a>
   <a href="M3.html">航跡表示</a>
  
  <a href="AISviewer.html">AIS（テスト）</a>
  <a href="M2.html">マニュアル</a>
</div>
<div class="menuOverlay" id="menuOverlay" onclick="closeMenu()"></div>

<!-- ハンバーガーボタン（左上） -->
<button class="hamburger-btn" onclick="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</button>

<div id="map"></div>

<div id="topbar">
  <div id="distance">距離: -- m</div>
</div>

<!-- 右上 -->
<div id="topRight">
  <button class="topBtn" onclick="resetAll()">リセット</button>
  <button class="topBtn" onclick="stop()">停止</button>
</div>

<div class="controls">
  <button class="btnA" onclick="setA()">A取得</button>
  <button class="btnB" onclick="setB()">B取得</button>
  <button class="btnC" onclick="start()">計測開始</button>
</div>

<script>
/* ===== メニュー制御 ===== */
function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("menuOverlay").classList.toggle("show");
}
function closeMenu(){
  document.getElementById("menu").classList.remove("open");
  document.getElementById("menuOverlay").classList.remove("show");
}

/* 現在ページ無効化 */
(function(){
  const menuLinks = document.querySelectorAll("#menu a");
  const currentPage = location.pathname.split("/").pop() || "index.html";
  menuLinks.forEach(link => {
    if(link.getAttribute("href") === currentPage){
      link.classList.add("active");
      link.removeAttribute("href");
    }
  });
})();

let map;
let posA = null;
let posB = null;
let markerA, markerB, markerC;
let lineAB, linePerp;
let intervalId = null;

const shipIcon = L.icon({
  iconUrl: "https://cdn-icons-png.flaticon.com/512/68/68843.png",
  iconSize: [30, 30],
  iconAnchor: [15, 15]
});

window.onload = () => {
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    map = L.map('map', { zoomControl: false }).setView([lat, lng], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
  });
};

function getLocation(callback) {
  navigator.geolocation.getCurrentPosition(
    pos => callback({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
    err => alert(err.message),
    { enableHighAccuracy: true }
  );
}

function setA() {
  getLocation(p => {
    posA = p;
    if (markerA) map.removeLayer(markerA);
    markerA = L.marker([p.lat, p.lng]).addTo(map);
    drawABLine();
  });
}

function setB() {
  getLocation(p => {
    posB = p;
    if (markerB) map.removeLayer(markerB);
    markerB = L.marker([p.lat, p.lng]).addTo(map);
    drawABLine();
  });
}

function drawABLine() {
  if (!posA || !posB) return;
  if (lineAB) map.removeLayer(lineAB);
  let dx = posB.lng - posA.lng;
  let dy = posB.lat - posA.lat;
  let extend = 5;
  let p1 = [posA.lat - dy * extend, posA.lng - dx * extend];
  let p2 = [posB.lat + dy * extend, posB.lng + dx * extend];
  lineAB = L.polyline([p1, p2], { color: 'blue' }).addTo(map);
}

function toXY(p) {
  const R = 6378137;
  return {
    x: R * p.lng * Math.PI / 180,
    y: R * Math.log(Math.tan(Math.PI/4 + (p.lat*Math.PI/180)/2))
  };
}

function toLatLng(p) {
  const R = 6378137;
  return {
    lng: (p.x / R) * 180 / Math.PI,
    lat: (2 * Math.atan(Math.exp(p.y / R)) - Math.PI/2) * 180 / Math.PI
  };
}

function start() {
  if (intervalId) return;
  intervalId = setInterval(() => {
    getLocation(posC => {
      if (!posA || !posB) return;
      let A = toXY(posA);
      let B = toXY(posB);
      let C = toXY(posC);
      let AB = { x: B.x - A.x, y: B.y - A.y };
      let AC = { x: C.x - A.x, y: C.y - A.y };
      let t = (AB.x*AC.x + AB.y*AC.y) / (AB.x*AB.x + AB.y*AB.y);
      let foot = {
        x: A.x + t * AB.x,
        y: A.y + t * AB.y
      };
      let footLatLng = toLatLng(foot);
      let dx = C.x - foot.x;
      let dy = C.y - foot.y;
      let distance = Math.sqrt(dx*dx + dy*dy);
      document.getElementById("distance").innerText =
        "距離: " + Math.round(distance) + " m";
      if (markerC) map.removeLayer(markerC);
      markerC = L.marker([posC.lat, posC.lng], { icon: shipIcon }).addTo(map);
      if (linePerp) map.removeLayer(linePerp);
      linePerp = L.polyline(
        [[posC.lat, posC.lng],[footLatLng.lat, footLatLng.lng]],
        { color: 'red' }
      ).addTo(map);
    });
  }, 1000);
}

function stop() {
  clearInterval(intervalId);
  intervalId = null;
}

function resetAll() {
  stop();
  posA = posB = null;
  if (markerA) map.removeLayer(markerA);
  if (markerB) map.removeLayer(markerB);
  if (markerC) map.removeLayer(markerC);
  if (lineAB) map.removeLayer(lineAB);
  if (linePerp) map.removeLayer(linePerp);
  document.getElementById("distance").innerText = "距離: -- m";
}
</script>
</body>
</html>
