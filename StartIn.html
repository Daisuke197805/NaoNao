<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="utf-8">

<title>距離測定アプリ</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body {

  margin: 0;

  padding: 0;

  height: 100%;

}

#map {

  position: fixed;

  top: 0;

  bottom: 0;

  width: 100%;

}

/* 上部距離表示 */

#topbar {

  position: fixed;

  top: 10px;

  left: 0;

  width: 100%;

  display: flex;

  justify-content: center;

  z-index: 1000;

}

#distance {

  background: rgba(255,255,255,0.9);

  padding: 8px 40px;

  font-size: 18px;

  border-radius: 10px;

}

/* 右上ボタン（縦並び） */

#topRight {

  position: fixed;

  top: 10px;

  right: 10px;

  z-index: 1000;

  display: flex;

  flex-direction: column;

  gap: 6px;

}

.topBtn {

  background: rgba(0,0,0,0.7);

  color: white;

  padding: 8px 10px;

  border-radius: 8px;

  border: none;

  text-decoration: none;

  text-align: center;

  font-size: 14px;

}

/* 下部ボタン */

.controls {

  position: fixed;

  bottom: 20px;

  width: 100%;

  display: flex;

  justify-content: space-around;

  z-index: 1000;

}

.controls button {

  font-size: 18px;

  padding: 15px;

  border-radius: 12px;

  border: none;

  color: white;

  width: 28%;

}

.btnA { background: #34C759; }

.btnB { background: #007AFF; }

.btnC { background: #FF3B30; }

</style>

</head>

<body>

<div id="map"></div>

<div id="topbar">

  <div id="distance">距離: -- m</div>

</div>

<!-- 右上（縦ボタン） -->

<div id="topRight">

  <a href="https://daisuke197805.github.io/NaoNao/" class="topBtn">戻る</a>

  <button class="topBtn" onclick="resetAll()">リセット</button>

  <button class="topBtn" onclick="stop()">停止</button>

</div>

<div class="controls">

  <button class="btnA" onclick="setA()">A</button>

  <button class="btnB" onclick="setB()">B</button>

  <button class="btnC" onclick="start()">C</button>

</div>

<script>

let map;

let posA = null;

let posB = null;

let markerA, markerB, markerC;

let lineAB, linePerp;

let intervalId = null;

/* 船アイコン */

const shipIcon = L.icon({

  iconUrl: "https://cdn-icons-png.flaticon.com/512/68/68843.png",

  iconSize: [30, 30],

  iconAnchor: [15, 15]

});

/* 初期化（現在地） */

window.onload = () => {

  navigator.geolocation.getCurrentPosition(pos => {

    const lat = pos.coords.latitude;

    const lng = pos.coords.longitude;

    map = L.map('map').setView([lat, lng], 17);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

      attribution: '&copy; OpenStreetMap contributors'

    }).addTo(map);

  });

};

/* 位置取得 */

function getLocation(callback) {

  navigator.geolocation.getCurrentPosition(

    pos => callback({

      lat: pos.coords.latitude,

      lng: pos.coords.longitude

    }),

    err => alert(err.message),

    { enableHighAccuracy: true }

  );

}

/* A */

function setA() {

  getLocation(p => {

    posA = p;

    if (markerA) map.removeLayer(markerA);

    markerA = L.marker([p.lat, p.lng]).addTo(map);

    drawABLine();

  });

}

/* B */

function setB() {

  getLocation(p => {

    posB = p;

    if (markerB) map.removeLayer(markerB);

    markerB = L.marker([p.lat, p.lng]).addTo(map);

    drawABLine();

  });

}

/* AB線 */

function drawABLine() {

  if (!posA || !posB) return;

  if (lineAB) map.removeLayer(lineAB);

  let dx = posB.lng - posA.lng;

  let dy = posB.lat - posA.lat;

  let extend = 5;

  let p1 = [posA.lat - dy * extend, posA.lng - dx * extend];

  let p2 = [posB.lat + dy * extend, posB.lng + dx * extend];

  lineAB = L.polyline([p1, p2], { color: 'blue' }).addTo(map);

}

/* 座標変換 */

function toXY(p) {

  const R = 6378137;

  return {

    x: R * p.lng * Math.PI / 180,

    y: R * Math.log(Math.tan(Math.PI/4 + (p.lat*Math.PI/180)/2))

  };

}

function toLatLng(p) {

  const R = 6378137;

  return {

    lng: (p.x / R) * 180 / Math.PI,

    lat: (2 * Math.atan(Math.exp(p.y / R)) - Math.PI/2) * 180 / Math.PI

  };

}

/* C開始 */

function start() {

  if (intervalId) return;

  intervalId = setInterval(() => {

    getLocation(posC => {

      if (!posA || !posB) return;

      let A = toXY(posA);

      let B = toXY(posB);

      let C = toXY(posC);

      let AB = { x: B.x - A.x, y: B.y - A.y };

      let AC = { x: C.x - A.x, y: C.y - A.y };

      let t = (AB.x*AC.x + AB.y*AC.y) / (AB.x*AB.x + AB.y*AB.y);

      let foot = {

        x: A.x + t * AB.x,

        y: A.y + t * AB.y

      };

      let footLatLng = toLatLng(foot);

      /* 距離 */

      let dx = C.x - foot.x;

      let dy = C.y - foot.y;

      let distance = Math.sqrt(dx*dx + dy*dy);

      document.getElementById("distance").innerText =

        "距離: " + Math.round(distance) + " m";

      /* Cマーカー */

      if (markerC) map.removeLayer(markerC);

      markerC = L.marker([posC.lat, posC.lng], { icon: shipIcon }).addTo(map);

      /* 垂線 */

      if (linePerp) map.removeLayer(linePerp);

      linePerp = L.polyline(

        [

          [posC.lat, posC.lng],

          [footLatLng.lat, footLatLng.lng]

        ],

        { color: 'red' }

      ).addTo(map);

    });

  }, 1000);

}

/* 停止 */

function stop() {

  clearInterval(intervalId);

  intervalId = null;

}

/* リセット */

function resetAll() {

  stop();

  posA = posB = null;

  if (markerA) map.removeLayer(markerA);

  if (markerB) map.removeLayer(markerB);

  if (markerC) map.removeLayer(markerC);

  if (lineAB) map.removeLayer(lineAB);

  if (linePerp) map.removeLayer(linePerp);

  document.getElementById("distance").innerText = "距離: -- m";

}

</script>

</body>

</html>
