<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="utf-8">

<title>AIS表示</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body {
  margin: 0;
  height: 100%;
}

#map {
  width: 100%;
  height: 100%;
}

#log {
  position: absolute;
  top: 0;
  left: 0;
  background: rgba(255,255,255,0.9);
  font-size: 12px;
  max-height: 220px;
  overflow: auto;
  z-index: 9999;
  width: 100%;
  padding: 4px;
  box-sizing: border-box;
  font-family: monospace;
}

</style>

</head>

<body>

<div id="log"></div>

<div id="map"></div>

<script>

const API_KEY = "02bfdf3e9685ae762daf1b00a97b9ef6d52ad98a";

let map;
let ships = {};
let socket;

window.onload = () => {

  const el = document.getElementById("log");

  if (el) {
    el.innerHTML = "ログ開始<br>";
  }

  initMap();
};

function log(msg) {

  const el = document.getElementById("log");

  if (!el) return;

  console.log(msg);

  el.innerHTML += msg + "<br>";

  el.scrollTop = el.scrollHeight;
}

function initMap() {

  map = L.map('map').setView([35.3, 139.8], 10);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  log("initMap完了");

  startAIS(35.0, 139.8);
}

function startAIS(lat, lng) {

  const delta = 3.0;

  log("AIS開始");

  socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

  socket.onopen = () => {

    log("WebSocket接続OK");

    const sub = {

      APIKey: API_KEY,

      BoundingBoxes: [[
        [lat - delta, lng - delta],
        [lat + delta, lng + delta]
      ]]
    };

    log("送信開始");

    log(JSON.stringify(sub));

    socket.send(JSON.stringify(sub));

    log("送信完了");
  };

  socket.onmessage = async (msg) => {

    log("メッセージ受信");

    let text;

    try {

      // iPad Safari対応
      if (msg.data instanceof Blob) {

        log("Blob受信");

        text = await msg.data.text();

      } else {

        text = msg.data;
      }

      log("受信文字列取得OK");

      const data = JSON.parse(text);

      log("JSON解析OK");

      const message = data.Message;

      if (!message) {
        log("Messageなし");
        return;
      }

      const report =
        message.PositionReport ||
        message.StandardClassBPositionReport ||
        message.LongRangeAisBroadcastMessage;

      if (!report) {
        log("位置レポートなし");
        return;
      }

      const mmsi = report.UserID;

      const shipLat = report.Latitude;

      const shipLng = report.Longitude;

      if (shipLat == null || shipLng == null) {

        log("緯度経度なし");

        return;
      }

      log("船データOK MMSI=" + mmsi);

      updateShip(mmsi, shipLat, shipLng);

    } catch (err) {

      log("JSON解析エラー");

      console.error(err);
    }
  };

  socket.onerror = (e) => {

    log("WebSocketエラー");

    console.error(e);
  };

  socket.onclose = (e) => {

    log("WebSocket切断");

    log("code=" + e.code);

    log("reason=" + e.reason);

    console.log(e);
  };
}

function updateShip(mmsi, lat, lng) {

  if (ships[mmsi]) {

    ships[mmsi].setLatLng([lat, lng]);

  } else {

    log("新規船追加 " + mmsi);

    const marker = L.circleMarker(
      [lat, lng],
      {
        radius: 5,
        color: 'blue',
        fillColor: 'blue',
        fillOpacity: 0.8
      }
    ).addTo(map);

    ships[mmsi] = marker;
  }
}

</script>

</body>
</html>
