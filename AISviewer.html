<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="utf-8">

<title>AIS表示</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body {

  margin: 0;

  height: 100%;

}

#map {

  width: 100%;

  height: 100%;

}

</style>

</head>

<body>

<div id="log" style="

  position:absolute;

  top:0;

  left:0;

  background:white;

  font-size:12px;

  max-height:200px;

  overflow:auto;

  z-index:9999;

  width:100%;

"></div>

<div id="map"></div>

<script>

const API_KEY = "02bfdf3e9685ae762daf1b00a97b9ef6d52ad98a";

let map;

let ships = {};

let socket;

window.onload = () => {

  const el = document.getElementById("log");

  if (el) el.innerHTML = "ログ開始<br>";

  initMap();

};

function log(msg) {

  const el = document.getElementById("log");

  if (!el) return;

  el.innerHTML += msg + "<br>";

}

function initMap() {

  map = L.map('map').setView([35.3, 139.8], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

    attribution: '&copy; OpenStreetMap contributors'

  }).addTo(map);

  log("initMap完了");

startAIS(35.0, 139.8);


}

function startAIS(lat, lng) {

  const delta = 3.0;

  socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

socket.onopen = () => {

  log("WebSocket接続OK");

  const sub = {
    APIKey: API_KEY,
    BoundingBoxes: [[
      [lat - delta, lng - delta],
      [lat + delta, lng + delta]
    ]]
  };

  log("送信:" + JSON.stringify(sub));

  socket.send(JSON.stringify(sub));
};
  socket.onerror = () => {

    log("WebSocketエラー");

  };

  socket.onmessage = (msg) => {

    // ★ここに入れてます（重要）

    const data = JSON.parse(msg.data);

    log(JSON.stringify(data));

    const message = data.Message;

    if (!message) return;

    const report =

      message.PositionReport ||

      message.StandardClassBPositionReport ||

      message.LongRangeAisBroadcastMessage;

    if (!report) return;

    const mmsi = report.UserID;

    const lat = report.Latitude;

    const lng = report.Longitude;

    if (lat == null || lng == null) return;

    log("船データOK");

    updateShip(mmsi, lat, lng);

  };

}

function updateShip(mmsi, lat, lng) {

  if (ships[mmsi]) {

    ships[mmsi].setLatLng([lat, lng]);

  } else {

    let marker = L.circleMarker([lat, lng], {

      radius: 5,

      color: 'blue'

    }).addTo(map);

    ships[mmsi] = marker;

  }

}

</script>

</body>

</html>
