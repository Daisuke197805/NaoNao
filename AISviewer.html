<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="utf-8">

<title>AIS表示</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body{
  margin:0;
  height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
}

#map{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
}

/* 船ラベル */
.ship-label{
  font-size:11px;
  font-weight:bold;
  color:blue;
  background:rgba(255,255,255,0.85);
  border:none;
  box-shadow:none;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

const API_KEY = "02bfdf3e9685ae762daf1b00a97b9ef6d52ad98a";

let map;
let ships = {};
let socket;

let myLocationMarker = null;

window.onload = () => {

  if (!navigator.geolocation) {

    initMap(35.3, 139.8);
    addMyLocation(35.3, 139.8);
    return;
  }

  navigator.geolocation.getCurrentPosition(

    (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      initMap(lat, lng);
      addMyLocation(lat, lng);
    },

    () => {

      initMap(35.3, 139.8);
      addMyLocation(35.3, 139.8);
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
};

/* =========================
   現在地（赤丸・ラベルなし）
========================= */

function addMyLocation(lat, lng) {

  if (myLocationMarker) {

    myLocationMarker.setLatLng([lat, lng]);
    return;
  }

  myLocationMarker = L.circleMarker([lat, lng], {

    radius: 8,
    color: 'red',
    fillColor: 'red',
    fillOpacity: 0.9

  }).addTo(map);
}

/* =========================
   地図
========================= */

function initMap(lat, lng) {

  map = L.map('map').setView([lat, lng], 10);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  startAIS(lat, lng);
}

/* =========================
   AIS開始
========================= */

function startAIS(lat, lng) {

  const delta = 1.0;

  socket = new WebSocket(
    "wss://stream.aisstream.io/v0/stream"
  );

  socket.onopen = () => {

    const sub = {

      APIKey: API_KEY,

      BoundingBoxes: [[
        [lat - delta, lng - delta],
        [lat + delta, lng + delta]
      ]]
    };

    socket.send(JSON.stringify(sub));
  };

  socket.onmessage = async (msg) => {

    try {

      let text;

      if (msg.data instanceof Blob) {
        text = await msg.data.text();
      } else {
        text = msg.data;
      }

      const data = JSON.parse(text);

      const message = data.Message;
      if (!message) return;

      const report =
        message.PositionReport ||
        message.StandardClassBPositionReport ||
        message.LongRangeAisBroadcastMessage;

      if (!report) return;

      const mmsi = report.UserID;

      const lat = report.Latitude;
      const lng = report.Longitude;

      if (lat == null || lng == null) return;

      const sog = report.Sog ?? 0;
      const cog = report.Cog ?? 0;

      updateShip(mmsi, lat, lng, sog, cog);

    } catch (e) {

      console.error(e);
    }
  };
}

/* =========================
   船更新
========================= */

function updateShip(mmsi, lat, lng, sog, cog) {

  const label =
    sog.toFixed(1) + "kt / " + Math.round(cog) + "°";

  if (ships[mmsi]) {

    ships[mmsi].marker.setLatLng([lat, lng]);
    ships[mmsi].marker.setTooltipContent(label);

    ships[mmsi].track.push([lat, lng]);

    if (ships[mmsi].track.length > 50) {
      ships[mmsi].track.shift();
    }

    ships[mmsi].line.setLatLngs(ships[mmsi].track);

  } else {

    const marker = L.circleMarker([lat, lng], {
      radius: 5,
      color: 'blue',
      fillColor: 'blue',
      fillOpacity: 0.8
    }).addTo(map);

    marker.bindTooltip(label, {
      permanent: true,
      direction: "top",
      className: "ship-label"
    });

    const line = L.polyline([[lat, lng]], {
      color: 'blue',
      weight: 2
    }).addTo(map);

    ships[mmsi] = {
      marker,
      track: [[lat, lng]],
      line
    };
  }
}

</script>

</body>
</html>
