<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="utf-8">

<title>AIS表示</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#111827;
  --border:#e5e7eb;
  --shadow:0 2px 14px rgba(0,0,0,.08);
}

*{
  box-sizing:border-box;
}

html, body{
  margin:0;
  height:100%;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
}

/* ===== ヘッダー ===== */

header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  background:linear-gradient(90deg,#1565c0,#1976d2);
  color:#fff;
  padding:12px 16px;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}

header .row{
  display:flex;
  align-items:center;
  gap:12px;
}

header .title{
  font-weight:800;
}

/* ===== ハンバーガー ===== */

.hamburger{
  width:28px;
  height:22px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
}

.hamburger span{
  height:3px;
  background:#fff;
  border-radius:2px;
}

/* ===== メニュー ===== */

#menu{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:#fff;
  box-shadow:2px 0 10px rgba(0,0,0,.15);
  padding:60px 16px;
  transition:left .25s;
  z-index:2000;
}

#menu.open{
  left:0;
}

#menu a{
  display:block;
  padding:12px;
  margin-bottom:8px;
  text-decoration:none;
  color:#111;
  font-weight:700;
  border-radius:8px;
}

#menu a:hover{
  background:#e3f2fd;
}

/* ===== オーバーレイ ===== */

.menuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  display:none;
  z-index:1500;
}

.menuOverlay.show{
  display:block;
}

/* ===== 地図 ===== */

#map{
  position:absolute;
  top:58px;
  left:0;
  right:0;
  bottom:0;
}

/* ===== 船ラベル ===== */

.ship-label{
  font-size:11px;
  font-weight:bold;
  color:blue;
  background:rgba(255,255,255,0.85);
  border:none;
  box-shadow:none;
}

</style>

</head>

<body>

<!-- ===== メニュー ===== -->

<div id="menu">

  <a href="index.html">トップ</a>
  <a href="event.html">レース&amp;イベント</a>
  <a href="StartIn.html">スタートライン</a>
  <a href="Timer.html">スタートタイマー</a>
  <a href="RateCompare.html">レーティング比較</a>
  <a href="M3.html">航跡表示</a>
  <a href="AISviewer.html">AIS（テスト）</a>
  <a href="M2.html">マニュアル</a>

</div>

<div class="menuOverlay" id="menuOverlay" onclick="closeMenu()"></div>

<!-- ===== ヘッダー ===== -->

<header>

  <div class="row">

    <div class="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="title">AIS Viewer</div>

  </div>

</header>

<!-- ===== 地図 ===== -->

<div id="map"></div>

<script>

const API_KEY = "02bfdf3e9685ae762daf1b00a97b9ef6d52ad98a";

let map;
let ships = {};
let socket;

window.onload = () => {

  // 現在地取得 → 中心決定
  if (!navigator.geolocation) {

    initMap(35.3, 139.8);
    return;
  }

  navigator.geolocation.getCurrentPosition(

    (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      initMap(lat, lng);
    },

    () => {

      initMap(35.3, 139.8);
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
};

/* ===== メニュー ===== */

function toggleMenu(){

  document.getElementById("menu").classList.toggle("open");
  document.getElementById("menuOverlay").classList.toggle("show");
}

function closeMenu(){

  document.getElementById("menu").classList.remove("open");
  document.getElementById("menuOverlay").classList.remove("show");
}

/* ===== 地図初期化 ===== */

function initMap(lat, lng) {

  map = L.map('map').setView([lat, lng], 10);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  startAIS(lat, lng);
}

/* ===== AIS ===== */

function startAIS(lat, lng) {

  const delta = 1.0;

  socket = new WebSocket(
    "wss://stream.aisstream.io/v0/stream"
  );

  socket.onopen = () => {

    const sub = {

      APIKey: API_KEY,

      BoundingBoxes: [[
        [lat - delta, lng - delta],
        [lat + delta, lng + delta]
      ]]
    };

    socket.send(JSON.stringify(sub));
  };

  socket.onmessage = async (msg) => {

    try {

      let text;

      // Blob対応（iPad Safari対策）
      if (msg.data instanceof Blob) {
        text = await msg.data.text();
      } else {
        text = msg.data;
      }

      const data = JSON.parse(text);

      const message = data.Message;

      if (!message) return;

      const report =
        message.PositionReport ||
        message.StandardClassBPositionReport ||
        message.LongRangeAisBroadcastMessage;

      if (!report) return;

      const mmsi = report.UserID;

      const shipLat = report.Latitude;
      const shipLng = report.Longitude;

      if (shipLat == null || shipLng == null) return;

      const sog = report.Sog ?? 0;
      const cog = report.Cog ?? 0;

      updateShip(mmsi, shipLat, shipLng, sog, cog);

    } catch (e) {

      console.error(e);
    }
  };
}

/* ===== 船更新 ===== */

function updateShip(mmsi, lat, lng, sog, cog) {

  const label =
    sog.toFixed(1) + "kt / " + Math.round(cog) + "°";

  if (ships[mmsi]) {

    ships[mmsi].marker.setLatLng([lat, lng]);
    ships[mmsi].marker.setTooltipContent(label);

    ships[mmsi].track.push([lat, lng]);

    if (ships[mmsi].track.length > 50) {
      ships[mmsi].track.shift();
    }

    ships[mmsi].line.setLatLngs(ships[mmsi].track);

  } else {

    const marker = L.circleMarker([lat, lng], {
      radius: 5,
      color: 'blue',
      fillColor: 'blue',
      fillOpacity: 0.8
    }).addTo(map);

    marker.bindTooltip(label, {
      permanent: true,
      direction: "top",
      className: "ship-label"
    });

    const line = L.polyline([[lat, lng]], {
      color: 'blue',
      weight: 2
    }).addTo(map);

    ships[mmsi] = {
      marker: marker,
      track: [[lat, lng]],
      line: line
    };
  }
}

</script>

</body>
</html>
