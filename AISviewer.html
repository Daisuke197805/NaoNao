<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="utf-8">

<title>AIS表示</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body {
  margin: 0;
  height: 100%;
}

#map {
  width: 100%;
  height: 100%;
}

#log {
  position: absolute;
  top: 0;
  left: 0;
  background: rgba(255,255,255,0.9);
  font-size: 12px;
  max-height: 180px;
  overflow: auto;
  z-index: 9999;
  width: 100%;
  padding: 4px;
  box-sizing: border-box;
  font-family: monospace;
}

.ship-label {
  font-size: 11px;
  font-weight: bold;
  color: blue;
  background: rgba(255,255,255,0.8);
  border: none;
  box-shadow: none;
}

</style>

</head>

<body>

<div id="log"></div>

<div id="map"></div>

<script>

const API_KEY = "02bfdf3e9685ae762daf1b00a97b9ef6d52ad98a";

let map;
let ships = {};
let socket;

window.onload = () => {

  const el = document.getElementById("log");

  if (el) {
    el.innerHTML = "ログ開始<br>";
  }

  initMap();
};

function log(msg) {

  const el = document.getElementById("log");

  if (!el) return;

  console.log(msg);

  el.innerHTML += msg + "<br>";

  el.scrollTop = el.scrollHeight;
}

function initMap() {

  map = L.map('map').setView([35.3, 139.8], 10);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  log("initMap完了");

  // 範囲を少し狭めた
  startAIS(35.0, 139.8);
}

function startAIS(lat, lng) {

  const delta = 2.0;

  log("AIS開始");

  socket = new WebSocket("wss://stream.aisstream.io/v0/stream");

  socket.onopen = () => {

    log("WebSocket接続OK");

    const sub = {

      APIKey: API_KEY,

      BoundingBoxes: [[
        [lat - delta, lng - delta],
        [lat + delta, lng + delta]
      ]]
    };

    log("送信開始");

    socket.send(JSON.stringify(sub));

    log("送信完了");
  };

  socket.onmessage = async (msg) => {

    try {

      let text;

      // iPad Safari Blob対応
      if (msg.data instanceof Blob) {

        text = await msg.data.text();

      } else {

        text = msg.data;
      }

      const data = JSON.parse(text);

      const message = data.Message;

      if (!message) return;

      const report =
        message.PositionReport ||
        message.StandardClassBPositionReport ||
        message.LongRangeAisBroadcastMessage;

      if (!report) return;

      const mmsi = report.UserID;

      const shipLat = report.Latitude;

      const shipLng = report.Longitude;

      if (shipLat == null || shipLng == null) return;

      // 速度（ノット）
      const sog = report.Sog ?? 0;

      // 進行方向
      const cog = report.Cog ?? 0;

      updateShip(
        mmsi,
        shipLat,
        shipLng,
        sog,
        cog
      );

    } catch (err) {

      log("JSON解析エラー");

      console.error(err);
    }
  };

  socket.onerror = (e) => {

    log("WebSocketエラー");

    console.error(e);
  };

  socket.onclose = (e) => {

    log("WebSocket切断");

    log("code=" + e.code);

    log("reason=" + e.reason);
  };
}

function updateShip(mmsi, lat, lng, sog, cog) {

  const label =
    sog.toFixed(1) + "kt" +
    " / " +
    Math.round(cog) + "°";

  // 既存船
  if (ships[mmsi]) {

    ships[mmsi].marker.setLatLng([lat, lng]);

    ships[mmsi].marker.setTooltipContent(label);

    // 航跡追加
    ships[mmsi].track.push([lat, lng]);

    // 長すぎ防止
    if (ships[mmsi].track.length > 50) {
      ships[mmsi].track.shift();
    }

    // 航跡更新
    ships[mmsi].line.setLatLngs(
      ships[mmsi].track
    );

  } else {

    log("新規船追加 " + mmsi);

    // 船マーカー
    const marker = L.circleMarker(
      [lat, lng],
      {
        radius: 5,
        color: 'blue',
        fillColor: 'blue',
        fillOpacity: 0.8
      }
    ).addTo(map);

    // 速度・COG表示
    marker.bindTooltip(
      label,
      {
        permanent: true,
        direction: "top",
        className: "ship-label"
      }
    );

    // 航跡線
    const line = L.polyline(
      [[lat, lng]],
      {
        color: 'blue',
        weight: 2
      }
    ).addTo(map);

    // 保存
    ships[mmsi] = {

      marker: marker,

      track: [[lat, lng]],

      line: line
    };
  }
}

</script>

</body>
</html>
